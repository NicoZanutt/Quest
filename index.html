let timelineOffset = 0;

function goTimeline() {
  currentView = "timeline";
  render();
}

function isoDay(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const dd = String(d.getDate()).padStart(2, "0");
  return y + "-" + m + "-" + dd;
}

function shortDate(iso) {
  return new Date(iso + "T12:00").toLocaleDateString("fr-FR", { day: "numeric", month: "short" });
}

function mondayOf(date) {
  const d = new Date(date);
  const day = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - day);
  return d;
}

function allTasksWithOrigin() {
  const list = [];
  for (const o of state.objectives) {
    for (const t of o.tasks) list.push({ task: t, originId: o.id, originName: o.name, isBg: false });
  }
  for (const t of state.background) list.push({ task: t, originId: "background", originName: "Intendance", isBg: true });
  return list;
}

function shiftWeek(delta) {
  timelineOffset = delta === 0 ? 0 : timelineOffset + delta;
  render();
}

function renderTimeline() {
  const box = document.getElementById("timelineContent");
  const todayIso = isoDay(new Date());
  const monday = mondayOf(new Date());
  monday.setDate(monday.getDate() + timelineOffset * 7);
  const days = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday);
    d.setDate(d.getDate() + i);
    days.push(d);
  }
  const dayNames = ["Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi", "Samedi", "Dimanche"];
  const fmt = d => d.toLocaleDateString("fr-FR", { day: "numeric", month: "long" });
  const all = allTasksWithOrigin();

  let html = "<div class='tl-nav'>" +
    "<button class='btn secondary small' onclick='shiftWeek(-1)'>← Semaine précédente</button>" +
    "<h2>📅 Semaine du " + fmt(days[0]) + " au " + fmt(days[6]) + "</h2>" +
    "<button class='btn secondary small' onclick='shiftWeek(1)'>Semaine suivante →</button>" +
    "</div>";
  if (timelineOffset !== 0) {
    html += "<div style='text-align:center;margin-bottom:14px'><button class='btn secondary small' onclick='shiftWeek(0)'>↩ Revenir à aujourd'hui</button></div>";
  }

  if (timelineOffset === 0) {
    const overdue = all.filter(x => x.task.due && x.task.due < todayIso && !x.task.done);
    html += "<div class='tl-day tl-overdue' ondragover='dragOverDay(event)' ondragenter='dragEnterDay(event)' ondragleave='dragLeaveDay(event)' ondrop='dropOnDay(event,\"" + todayIso + "\")'>" +
      "<div class='tl-day-head'><span class='tl-day-name' style='color:var(--red)'>🔥 En retard</span>" +
      "<span class='tl-day-num'>" + overdue.length + " mission(s) passée(s)</span>" +
      "<button class='plan-link' onclick=\"openPlanModal('" + todayIso + "')\">+ Planifier ici…</button></div>";
    if (overdue.length === 0) {
      html += "<div class='tl-empty'>Rien en retard. Propre sur toi 💪</div>";
    } else {
      html += "<ul class='task-list'>" + overdue.map(x => tlTaskItem(x)).join("") + "</ul>";
    }
    html += "</div>";
  }

  for (let i = 0; i < 7; i++) {
    const d = days[i];
    const iso = isoDay(d);
    const isToday = iso === todayIso;
    const items = all.filter(x => x.task.due === iso);
    const todo = items.filter(x => !x.task.done);
    const done = items.filter(x => x.task.done);
    html += "<div class='tl-day" + (isToday ? " today" : "") + "' " +
      "ondragover='dragOverDay(event)' ondragenter='dragEnterDay(event)' ondragleave='dragLeaveDay(event)' ondrop='dropOnDay(event,\"" + iso + "\")'>" +
      "<div class='tl-day-head'><span class='tl-day-name'>" + dayNames[i] + (isToday ? " · aujourd'hui" : "") + "</span>" +
      "<span class='tl-day-num'>" + fmt(d) + "</span>" +
      "<button class='plan-link' onclick=\"openPlanModal('" + iso + "')\">+ Planifier…</button></div>";
    if (items.length === 0) {
      html += "<div class='tl-empty'>Rien de prévu · dépose une mission ici</div>";
    } else {
      html += "<ul class='task-list'>" + todo.map(x => tlTaskItem(x)).join("") + done.map(x => tlTaskItem(x)).join("") + "</ul>";
    }
    html += "</div>";
  }

  box.innerHTML = html;
}

function tlTaskItem(x) {
  const t = x.task;
  const imp = IMPORTANCE[t.imp];
  return "<li id='task-li-" + t.id + "' class='" + (t.done ? "done" : "") + (t.monster ? " monster" : "") + "' draggable='true' " +
    "ondragstart='dragTask(event,\"" + x.originId + "\",\"" + t.id + "\")' ondragend='dragEnd()'>" +
    "<div class='check' onclick=\"tlToggle('" + x.originId + "','" + t.id + "',event)\">✔</div>" +
    (t.monster ? "<span class='monster-chip'>👹</span>" : "") +
    "<span class='task-name'>" + esc(t.name) + "</span>" +
    subBadge(t) +
    (t.done
      ? "<span class='task-xp'>+" + t.xp + " XP</span>" +
        "<button class='icon-btn' title='Remettre en jeu' onclick=\"tlReplay('" + x.originId + "','" + t.id + "')\">↺</button>"
      : "") +
    "<span class='tl-origin'>" + esc(x.originName) + "</span>" +
    "<span class='tag tag-" + t.imp + "'>" + imp.icon + " ×" + t.imp + "</span>" +
    "<span class='task-actions'>" +
    (t.due ? "<button class='icon-btn' title='Retirer de la semaine (la mission reste dans sa quête)' onclick=\"unscheduleTask('" + x.originId + "','" + t.id + "')\">📅✕</button>" : "") +
    "<button class='icon-btn' title='Supprimer la mission' onclick=\"confirmDeleteTl('" + x.originId + "','" + t.id + "')\">🗑️</button>" +
    "</span>" +
    "</li>";
}

function tlToggle(originId, taskId, e) {
  if (originId === "background") toggleBgTask(taskId, e);
  else toggleTask(originId, taskId, e);
}

function tlReplay(originId, taskId) {
  if (originId === "background") resetBgTask(taskId);
  else replayTask(originId, taskId);
}

function confirmDeleteTl(originId, taskId) {
  if (originId === "background") confirmDeleteBgTask(taskId);
  else confirmDeleteTask(originId, taskId);
}

function unscheduleTask(originId, taskId) {
  const found = allTasksWithOrigin().find(x => x.task.id === taskId && x.originId === originId);
  if (!found || !found.task.due) return;
  found.task.due = "";
  saveState();
  render();
  toast("🗓️ " + found.task.name + " retirée de la semaine (mission conservée)", false);
}

function dragOverDay(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = "move";
}

function dragEnterDay(e) {
  if (e.currentTarget.contains(e.relatedTarget)) return;
  e.currentTarget.classList.add("drag-over");
}

function dragLeaveDay(e) {
  if (e.currentTarget.contains(e.relatedTarget)) return;
  e.currentTarget.classList.remove("drag-over");
}

function dropOnDay(e, iso) {
  e.preventDefault();
  const info = window._drag;
  dragEnd();
  if (!info) return;
  const found = allTasksWithOrigin().find(x => x.task.id === info.taskId && x.originId === info.objId);
  if (!found) return;
  found.task.due = iso;
  saveState();
  render();
  toast("📅 " + found.task.name + " → " + new Date(iso + "T12:00").toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "short" }), false);
}

function openPlanModal(iso) {
  const all = allTasksWithOrigin();
  const todo = all.filter(x => !x.task.done);
  const done = all.filter(x => x.task.done);
  const dayLabel = new Date(iso + "T12:00").toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
  const row = x => {
    const t = x.task;
    const current = t.due ? "📅 " + shortDate(t.due) : "non planifiée";
    return "<li onclick=\"planTask('" + x.originId + "','" + t.id + "','" + iso + "')\">" +
      "<span class='task-name'>" + (t.monster ? "👹 " : "") + esc(t.name) + "</span>" +
      "<span class='tl-origin'>" + esc(x.originName) + "</span>" +
      "<span class='tag tag-" + t.imp + "'>×" + t.imp + "</span>" +
      "<span class='ach-date'>" + current + "</span>" +
      "</li>";
  };
  let body = "";
  if (todo.length > 0) {
    body += "<p class='hint'>À faire :</p><ul class='task-list tl-plan-list'>" + todo.map(row).join("") + "</ul>";
  }
  if (done.length > 0) {
    body += "<p class='hint' style='margin-top:14px'>✓ Déjà faites · planifier remet en jeu (XP conservé) :</p>" +
      "<ul class='task-list tl-plan-list'>" + done.map(x => {
        const li = row(x);
        return li.replace("<span class='task-name'>", "<span class='task-name' style='text-decoration:line-through'>");
      }).join("") + "</ul>";
  }
  if (all.length === 0) body = "<p class='hint'>Aucune mission disponible. Crée des missions dans tes quêtes ou l'Intendance.</p>";
  openModal(
    "<h3>Planifier sur " + dayLabel + "</h3>" +
    body +
    "<div class='modal-actions'><button class='btn secondary' onclick='closeModal()'>Fermer</button></div>"
  );
}

function planTask(originId, taskId, iso) {
  const found = allTasksWithOrigin().find(x => x.task.id === taskId && x.originId === originId);
  if (!found) return;
  const wasDone = found.task.done;
  found.task.done = false;
  found.task.due = iso;
  saveState();
  closeModal();
  render();
  toast(wasDone
    ? "↺ Remise en jeu · " + found.task.name + " → " + shortDate(iso)
    : "📅 " + found.task.name + " → " + shortDate(iso), false);
}

function findTaskEverywhere(objId, taskId) {
  let obj = state.objectives.find(o => o.id === objId) || null;
  let task = obj ? obj.tasks.find(t => t.id === taskId) : null;
  if (!task) {
    for (const o of state.objectives) {
      const t = o.tasks.find(t => t.id === taskId);
      if (t) { obj = o; task = t; break; }
    }
  }
  return { obj, task };
}

function confirmDeleteTask(objId, taskId) {
  const found = findTaskEverywhere(objId, taskId);
  const obj = found.obj;
  const task = found.task;
  if (!obj || !task) return;
  openModal(
    "<h3>Supprimer la mission ?</h3>" +
    "<p class='hint'>« " + esc(task.name) + " » sera supprimée." + (task.done ? " Les " + task.xp + " XP gagnés seront retirés." : "") + "</p>" +
    "<div class='modal-actions'>" +
    "<button class='btn secondary' onclick='closeModal()'>Annuler</button>" +
    "<button class='btn danger' onclick='deleteTask(\"" + obj.id + "\",\"" + task.id + "\")'>Supprimer</button>" +
    "</div>"
  );
}

function deleteTask(objId, taskId) {
  const found = findTaskEverywhere(objId, taskId);
  const obj = found.obj;
  const task = found.task;
  if (!obj || !task) return;
  if (task.done) {
    state.xp -= task.xp;
    const idx = state.log.findIndex(e => e.taskId === taskId);
    if (idx !== -1) state.log.splice(idx, 1);
  }
  obj.tasks = obj.tasks.filter(t => t.id !== taskId);
  saveState();
  closeModal();
  render();
}

window._openSubtasks = new Set();

function findTaskContainer(originId, taskId) {
  if (originId === "background") {
    const task = state.background.find(t => t.id === taskId);
    return task ? { task, isBg: true } : null;
  }
  const found = findTaskEverywhere(originId, taskId);
  return found.task ? { task: found.task, isBg: false } : null;
}

function toggleSubtasks(originId, taskId, e) {
  if (e) e.stopPropagation();
  if (window._openSubtasks.has(taskId)) window._openSubtasks.delete(taskId);
  else window._openSubtasks.add(taskId);
  render();
}

function toggleSubtask(originId, taskId, itemId) {
  const found = findTaskContainer(originId, taskId);
  if (!found) return;
  const it = (found.task.items || []).find(x => x.id === itemId);
  if (!it) return;
  it.done = !it.done;
  saveState();
  render();
}

function deleteSubtask(originId, taskId, itemId) {
  const found = findTaskContainer(originId, taskId);
  if (!found) return;
  found.task.items = (found.task.items || []).filter(x => x.id !== itemId);
  saveState();
  render();
}

function addSubtask(originId, taskId) {
  const found = findTaskContainer(originId, taskId);
  if (!found) return;
  const input = document.getElementById("sub-input-" + taskId);
  const name = (input.value || "").trim();
  if (!name) return;
  if (!Array.isArray(found.task.items)) found.task.items = [];
  found.task.items.push({ id: uid(), name, done: false });
  saveState();
  render();
  const el = document.getElementById("sub-input-" + taskId);
  if (el) el.focus();
}

function subInputKey(e, originId, taskId) {
  if (e.key === "Enter") {
    e.preventDefault();
    addSubtask(originId, taskId);
  }
}

function subBadge(t) {
  const items = t.items || [];
  if (items.length === 0) return "";
  const doneItems = items.filter(it => it.done).length;
  return "<span class='sub-badge" + (doneItems === items.length ? " complete" : "") + "'>" + doneItems + "/" + items.length + "</span>";
}

function subPanelLi(originId, t) {
  const items = t.items || [];
  const row = it =>
    "<li class='" + (it.done ? "done" : "") + "'>" +
    "<div class='check sub-check' onclick=\"toggleSubtask('" + originId + "','" + t.id + "','" + it.id + "')\">✔</div>" +
    "<span class='sub-name'>" + esc(it.name) + "</span>" +
    "<button class='icon-btn' title='Supprimer la tâche' onclick=\"deleteSubtask('" + originId + "','" + t.id + "','" + it.id + "')\">🗑️</button>" +
    "</li>";
  return "<li class='sub-panel'>" +
    (items.length === 0 ? "<div class='sub-empty'>Aucune tâche. Découpe cette mission en étapes.</div>" : "") +
    "<ul class='sub-list'>" + items.map(row).join("") + "</ul>" +
    "<div class='sub-add'>" +
    "<input type='text' id='sub-input-" + t.id + "' placeholder='Nouvelle tâche…' onkeydown=\"subInputKey(event,'" + originId + "','" + t.id + "')\">" +
    "<button class='btn secondary small' onclick=\"addSubtask('" + originId + "','" + t.id + "')\">+ Ajouter</button>" +
    "</div>" +
    "</li>";
}

function openAchievements() {
  const items = ACHIEVEMENTS.map(a => {
    const unlockedAt = state.unlocked[a.id];
    const li = "<li class='" + (unlockedAt ? "" : "locked") + "'>" +
      "<div class='ach-icon'>" + (unlockedAt ? a.icon : "🔒") + "</div>" +
      "<div><div class='ach-name'>" + esc(a.name) + "</div><div class='ach-desc'>" + esc(a.desc) + "</div></div>" +
      "<div class='ach-date'>" + (unlockedAt ? formatDate(unlockedAt) : "") + "</div>" +
      "</li>";
    return li;
  }).join("");
  openModal(
    "<h3>🏆 Achievements (" + Object.keys(state.unlocked).length + "/" + ACHIEVEMENTS.length + ")</h3>" +
    "<ul class='ach-list'>" + items + "</ul>" +
    "<div class='modal-actions'><button class='btn' onclick='closeModal()'>Fermer</button></div>"
  );
}

function checkAchievements() {
  const newly = ACHIEVEMENTS.filter(a => !state.unlocked[a.id] && a.test(state));
  newly.forEach((a, i) => {
    state.unlocked[a.id] = new Date().toISOString();
    setTimeout(() => toast(a.icon + " Achievement : " + a.name, true), 400 * (i + 1));
  });
  if (newly.length > 0) {
    saveState();
    renderHeader();
  }
}

let toastCount = 0;
function toast(msg, gold) {
  const el = document.createElement("div");
  el.className = "toast" + (gold ? " gold" : "");
  el.textContent = msg;
  document.getElementById("toasts").appendChild(el);
  const delay = 2600 + toastCount * 200;
  toastCount++;
  setTimeout(() => {
    el.style.transition = "opacity 0.4s";
    el.style.opacity = "0";
    setTimeout(() => { el.remove(); toastCount--; }, 400);
  }, delay);
}

/* ---- Effets de célébration ---- */

let fxCheckPos = null;

function fxRememberClick(e) {
  if (!e || !e.target || !e.target.getBoundingClientRect) return;
  const r = e.target.getBoundingClientRect();
  fxCheckPos = { x: r.left + r.width / 2, y: r.top + r.height / 2 };
}

function fxAttach(el, ms) {
  document.body.appendChild(el);
  setTimeout(() => el.remove(), ms);
}

function fxConfetti(x, y, count, power) {
  const colors = ["var(--accent)", "var(--accent2)", "var(--green)", "var(--yellow)", "var(--orange)"];
  for (let i = 0; i < count; i++) {
    const p = document.createElement("div");
    p.className = "fx-particle";
    const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.9;
    const dist = power * (0.55 + Math.random() * 0.75);
    const dx = Math.cos(angle) * dist;
    const rise = Math.sin(angle) * dist * 0.7 - power * 0.45;
    const drop = rise + 35 + Math.random() * 45;
    if (Math.random() < 0.25) {
      p.textContent = Math.random() < 0.5 ? "✦" : "⭐";
      p.style.fontSize = (9 + Math.random() * 9) + "px";
      p.style.color = colors[i % colors.length];
    } else {
      const size = 5 + Math.random() * 5;
      p.style.width = size + "px";
      p.style.height = size * (Math.random() < 0.5 ? 1 : 0.55) + "px";
      p.style.background = colors[i % colors.length];
      p.style.borderRadius = Math.random() < 0.35 ? "50%" : "2px";
    }
    p.style.left = x + "px";
    p.style.top = y + "px";
    p.animate([
      { transform: "translate(-50%, -50%) rotate(0deg) scale(1)", opacity: 1 },
      { transform: "translate(calc(-50% + " + (dx * 0.75).toFixed(1) + "px), calc(-50% + " + rise.toFixed(1) + "px)) rotate(" + (90 + Math.random() * 180).toFixed(0) + "deg) scale(1)", opacity: 1, offset: 0.55 },
      { transform: "translate(calc(-50% + " + dx.toFixed(1) + "px), calc(-50% + " + drop.toFixed(1) + "px)) rotate(" + (200 + Math.random() * 220).toFixed(0) + "deg) scale(0.3)", opacity: 0 }
    ], { duration: 650 + Math.random() * 450, easing: "cubic-bezier(0.2, 0.7, 0.4, 1)" });
    fxAttach(p, 1200);
  }
}

function fxCelebrateXp(xp) {
  const p = fxCheckPos || { x: window.innerWidth / 2, y: window.innerHeight * 0.75 };
  const ring = document.createElement("div");
  ring.className = "fx-ring";
  ring.style.left = p.x + "px";
  ring.style.top = p.y + "px";
  fxAttach(ring, 700);
  const label = document.createElement("div");
  label.className = "fx-xp";
  label.textContent = "+" + xp + " XP";
  label.style.left = p.x + "px";
  label.style.top = p.y + "px";
  fxAttach(label, 1300);
  fxConfetti(p.x, p.y, 14, 55);
  const bar = document.getElementById("hBar");
  if (bar) {
    bar.classList.remove("gain-flash");
    void bar.offsetWidth;
    bar.classList.add("gain-flash");
  }
}

function fxCelebrateLevel(level) {
  const x = window.innerWidth / 2;
  const y = window.innerHeight * 0.4;
  const label = document.createElement("div");
  label.className = "fx-xp big";
  label.textContent = "🎉 NIVEAU " + level + " !";
  label.style.left = x + "px";
  label.style.top = y + "px";
  fxAttach(label, 1700);
  fxConfetti(x, y, 40, 130);
  setTimeout(() => fxConfetti(x, y + 30, 24, 100), 220);
}

function fxPopTask(taskId) {
  const li = document.getElementById("task-li-" + taskId);
  if (li) li.classList.add("just-done");
}

function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "quest-backup.json";
  a.click();
  URL.revokeObjectURL(a.href);
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const s = JSON.parse(reader.result);
      if (typeof s.xp !== "number" || !Array.isArray(s.objectives)) throw new Error("bad");
      state = normalizeState(s);
      saveState();
      currentView = "home";
      render();
      toast("Données importées ✔", false);
    } catch (e) {
      toast("Fichier invalide", true);
    }
  };
  reader.readAsText(file);
  event.target.value = "";
}

/* ---- Sync Obsidian (app vers vault, sens unique) ---- */

const DASHBOARD_NAME = "Quest - Tableau de bord.md";
let vaultHandle = null;
let syncTimer = null;

function syncBtnEl() {
  return document.getElementById("syncBtn");
}

function updateSyncUI(status, timeStr) {
  const btn = syncBtnEl();
  if (!btn) return;
  btn.classList.remove("sync-ok", "sync-err");
  if (status === "off") { btn.textContent = "💾 Obsidian"; btn.title = "Connecter le vault Obsidian"; }
  else if (status === "on") { btn.textContent = "💾 Obsidian"; btn.title = "Connecté · cliquer pour synchroniser maintenant"; }
  else if (status === "synced") { btn.classList.add("sync-ok"); btn.textContent = "💾 ✓ Obsidian"; btn.title = "Synchro OK " + (timeStr || ""); }
  else if (status === "error") { btn.classList.add("sync-err"); btn.textContent = "💾 ⚠ Obsidian"; btn.title = "Synchro impossible · cliquer pour reconnecter"; }
}

function idbOpen() {
  return new Promise((res, rej) => {
    const req = indexedDB.open("bossquest-sync", 1);
    req.onupgradeneeded = () => req.result.createObjectStore("handles");
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}

async function saveHandle(h) {
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction("handles", "readwrite");
    tx.objectStore("handles").put(h, "vault");
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  });
}

async function loadHandle() {
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction("handles", "readonly");
    const rq = tx.objectStore("handles").get("vault");
    rq.onsuccess = () => res(rq.result || null);
    rq.onerror = () => rej(rq.error);
  });
}

async function connectVault() {
  if (!window.showDirectoryPicker) {
    toast("Sync Obsidian : utilise Chrome ou Edge", true);
    return;
  }
  try {
    const picked = await window.showDirectoryPicker({ mode: "readwrite" });
    if (picked) {
      vaultHandle = picked;
      await saveHandle(vaultHandle);
      toast("💾 Vault connecté", false);
      await syncNow(false);
    }
  } catch (e) {
    updateSyncUI(vaultHandle ? "on" : "off");
  }
}

async function syncNow(silent) {
  if (!vaultHandle) return;
  try {
    const perm = await vaultHandle.queryPermission({ mode: "readwrite" });
    if (perm !== "granted") {
      const asked = await vaultHandle.requestPermission({ mode: "readwrite" });
      if (asked !== "granted") throw new Error("permission refusée");
    }
    const fh = await vaultHandle.getFileHandle(DASHBOARD_NAME, { create: true });
    const w = await fh.createWritable();
    await w.write(buildDashboard());
    await w.close();
    updateSyncUI("synced", new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }));
  } catch (e) {
    updateSyncUI("error");
    if (!silent) toast("Sync échouée : " + e.message, true);
  }
}

function scheduleSync() {
  if (!vaultHandle || !window.showDirectoryPicker) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => syncNow(true), 4000);
}

function syncClick() {
  if (!window.showDirectoryPicker) {
    copyDashboard();
    return;
  }
  if (!vaultHandle) { connectVault(); return; }
  syncNow(false);
}

function copyDashboard() {
  const md = buildDashboard();
  const done = () => {
    updateSyncUI("synced", new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }));
    toast("📋 Tableau de bord copié · colle-le dans la note Obsidian", false);
  };
  const fail = () => {
    updateSyncUI("error");
    toast("Copie impossible, utilise Ctrl+V manuellement après sélection", true);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(md).then(done).catch(() => fallbackCopy(md, done, fail));
  } else {
    fallbackCopy(md, done, fail);
  }
}

function fallbackCopy(text, done, fail) {
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand("copy");
    ta.remove();
    if (ok) done(); else fail();
  } catch (e) {
    fail();
  }
}

async function initSync() {
  if (!window.showDirectoryPicker) {
    updateSyncUI("off");
    const btn = syncBtnEl();
    btn.textContent = "📋 Copier";
    btn.title = "Copier le tableau de bord en markdown pour Obsidian";
    return;
  }
  try {
    vaultHandle = await loadHandle();
    if (vaultHandle) {
      const perm = await vaultHandle.queryPermission({ mode: "readwrite" });
      if (perm === "granted") {
        updateSyncUI("on");
        syncNow(true);
        return;
      }
      updateSyncUI("error");
    } else {
      updateSyncUI("off");
    }
  } catch (e) {
    updateSyncUI("off");
  }
}

function buildDashboard() {
  const now = new Date();
  const info = levelInfo(state.xp);
  let md = "---\ntype: dashboard\ngenerated: " + now.toISOString() + "\n---\n\n";
  md += "# ⚔️ Quest - Tableau de bord\n\n";
  md += "> Généré automatiquement depuis l'app (" + now.toLocaleString("fr-FR") + "). Ne pas éditer à la main. Voir [[App Gamification]]\n\n";

  md += "## 🎖️ Joueur\n\n";
  md += "**Niveau " + info.level + " · " + titleFor(info.level) + "** · " + state.xp + " XP · prochain niveau dans " + (info.need - info.done) + " XP\n\n";

  md += "## 🎯 Quêtes\n\n";
  if (state.objectives.length === 0) md += "_Aucune quête_\n\n";
  for (const o of state.objectives) {
    const st = objectiveStats(o);
    md += "### " + o.name + (o.cat ? " · " + o.cat : "") + " · " + st.pct + "% (" + st.done + "/" + st.total + ")\n\n";
    for (const t of o.tasks.filter(x => !x.done)) {
      md += "- [ ] " + (t.monster ? "👹 " : "") + t.name + (t.due ? " 📅 " + shortDate(t.due) : "") + " (×" + t.imp + ")\n";
    }
    for (const t of o.tasks.filter(x => x.done)) {
      md += "- [x] " + (t.monster ? "👹 " : "") + t.name + " (+" + t.xp + " XP)\n";
    }
    md += "\n";
  }

  md += "## ⚙️ Intendance\n\n";
  if (state.background.length === 0) md += "_Aucune mission de fond_\n\n";
  for (const t of state.background) {
    if (t.done) {
      md += "- [x] " + (t.monster ? "👹 " : "") + t.name + " (+" + t.xp + " XP" + (t.lastDone ? " · " + formatDate(t.lastDone) : "") + ")\n";
    } else {
      md += "- [ ] " + (t.monster ? "👹 " : "") + t.name + (t.due ? " 📅 " + shortDate(t.due) : "") + " (×" + t.imp + ")\n";
    }
  }
  md += "\n";

  const monday = mondayOf(now);
  const dayNames = ["Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi", "Samedi", "Dimanche"];
  const all = allTasksWithOrigin();
  md += "## 📅 Semaine du " + monday.toLocaleDateString("fr-FR", { day: "numeric", month: "long" }) + "\n\n";
  let anyPlanned = false;
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday);
    d.setDate(d.getDate() + i);
    const iso = isoDay(d);
    const items = all.filter(x => x.task.due === iso);
    if (items.length === 0) continue;
    anyPlanned = true;
    md += "### " + dayNames[i] + " " + d.getDate() + "\n";
    for (const x of items) {
      const t = x.task;
      md += (t.done ? "- [x] " : "- [ ] ") + t.name + " · " + x.originName + (t.done ? " (+" + t.xp + " XP)" : "") + "\n";
    }
    md += "\n";
  }
  if (!anyPlanned) md += "_Rien de planifié cette semaine_\n\n";

  md += "## ✅ Dernières victoires\n\n";
  const recent = state.log.slice(-10).reverse();
  if (recent.length === 0) md += "_Aucune victoire pour l'instant_\n\n";
  for (const e of recent) {
    md += "- " + e.taskName + " : +" + e.xp + " XP (" + e.minutes + " min × " + e.mult + " · " + formatDate(e.date) + ")\n";
  }

  md += "\n## 🏆 Achievements (" + Object.keys(state.unlocked).length + "/" + ACHIEVEMENTS.length + ")\n\n";
  for (const a of ACHIEVEMENTS) {
    const at = state.unlocked[a.id];
    if (at) md += "- " + a.icon + " **" + a.name + "** (" + formatDate(at) + ")\n";
  }
  return md;
}

/* ---- Sauvegarde cloud Supabase ---- */

const SUPABASE_URL = "https://ofiaejpxqbzbkxzmqcku.supabase.co/rest/v1";
const SUPABASE_KEY = "sb_publishable_8KwtM--VIDk8Gq0XeszWiw_NPeUE7Zf";
const SAVE_ID_KEY = "bossquest-save-id";

let cloudStatus = "idle";
let cloudTimer = null;
let cloudPending = false;
let saveId = localStorage.getItem(SAVE_ID_KEY);

function getOrCreateSaveId() {
  if (saveId) return saveId;
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let code = "NICO-";
  for (let i = 0; i < 8; i++) {
    code += chars[Math.floor(Math.random() * chars.length)];
    if (i === 3) code += "-";
  }
  saveId = code;
  localStorage.setItem(SAVE_ID_KEY, code);
  return code;
}

function supabaseHeaders(extra) {
  const h = {
    "apikey": SUPABASE_KEY,
    "Authorization": "Bearer " + SUPABASE_KEY,
    "Content-Type": "application/json"
  };
  if (extra) Object.assign(h, extra);
  return h;
}

async function cloudGet(id) {
  const res = await fetch(SUPABASE_URL + "/bossquest_saves?id=eq." + encodeURIComponent(id) + "&select=data", {
    headers: supabaseHeaders()
  });
  if (!res.ok) throw new Error("HTTP " + res.status);
  const rows = await res.json();
  return rows.length > 0 ? rows[0].data : null;
}

async function cloudPush() {
  const id = getOrCreateSaveId();
  const res = await fetch(SUPABASE_URL + "/bossquest_saves", {
    method: "POST",
    headers: supabaseHeaders({ "Prefer": "resolution=merge-duplicates" }),
    body: JSON.stringify({ id: id, data: state, updated_at: new Date().toISOString() })
  });
  if (!res.ok) throw new Error("HTTP " + res.status);
}

function scheduleCloudPush() {
  cloudPending = true;
  clearTimeout(cloudTimer);
  cloudTimer = setTimeout(() => cloudSave(true), 4000);
}

async function cloudSave(silent) {
  cloudStatus = "busy";
  updateCloudUI();
  try {
    await cloudPush();
    cloudPending = false;
    cloudStatus = "ok";
    updateCloudUI();
    if (!silent) toast("☁️ Sauvegardé dans le cloud", false);
  } catch (e) {
    cloudStatus = "error";
    updateCloudUI();
    if (!silent) toast("☁️ Sauvegarde échouée : " + e.message, true);
  }
}

async function cloudInit() {
  getOrCreateSaveId();
  try {
    const remote = await cloudGet(saveId);
    if (remote && typeof remote.xp === "number") {
      const localTime = state.updatedAt || "";
      const remoteTime = remote.updatedAt || "";
      if (remoteTime > localTime) {
        state = normalizeState(remote);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        render();
      } else {
        cloudSave(true);
      }
    } else {
      cloudSave(true);
    }
    if (cloudStatus !== "error") { cloudStatus = "ok"; updateCloudUI(); }
  } catch (e) {
    cloudStatus = "error";
    updateCloudUI();
  }
}

function updateCloudUI() {
  const btn = document.getElementById("cloudBtn");
  if (!btn) return;
  btn.classList.remove("sync-ok", "sync-err");
  if (cloudStatus === "ok") {
    btn.classList.add("sync-ok");
    btn.title = "Sauvegardé dans le cloud";
  } else if (cloudStatus === "busy") {
    btn.textContent = "⏳";
    btn.title = "Sauvegarde en cours";
  } else if (cloudStatus === "error") {
    btn.classList.add("sync-err");
    btn.textContent = "☁️";
    btn.title = "Problème de synchro cloud · clique pour voir";
  } else {
    btn.textContent = "☁️";
    btn.title = "Sauvegarde cloud";
  }
  if (cloudStatus !== "busy") btn.textContent = "☁️";
}

function cloudStatusLabel() {
  if (cloudStatus === "ok") return "✓ Sauvegardé";
  if (cloudStatus === "busy") return "⏳ En cours";
  if (cloudStatus === "error") return "⚠ Connexion impossible";
  return "En attente";
}

function openCloudModal() {
  openModal(

    "<p class='hint'>Status : " + cloudStatusLabel() + "</p>" +

    "<button class='btn' onclick='cloudSaveFromModal()'>Sauvegarder maintenant</button>" +
    "</div>" +
    "<div class='modal-actions'>" +
    "<button class='btn secondary' onclick='closeModal()'>Fermer</button>" +
    "</div>"
  );
}

function cloudSaveFromModal() {
  const newId = (document.getElementById("mSaveId").value || "").trim().toUpperCase();
  if (newId && newId !== saveId) {
    saveId = newId;
    localStorage.setItem(SAVE_ID_KEY, saveId);
  }
  closeModal();
  cloudSave(false);
}

async function cloudRestoreFromModal() {
  const newId = (document.getElementById("mSaveId").value || "").trim().toUpperCase();
  if (!newId) return;
  try {
    const remote = await cloudGet(newId);
    if (!remote || typeof remote.xp !== "number") {
      toast("Aucune sauvegarde cloud pour ce code", true);
      return;
    }
    saveId = newId;
    localStorage.setItem(SAVE_ID_KEY, saveId);
    state = normalizeState(remote);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    currentView = "home";
    closeModal();
    render();
    toast("☁️ Données restaurées depuis le cloud", false);
  } catch (e) {
    toast("Restauration échouée : " + e.message, true);
  }
}

window.addEventListener("beforeunload", () => {
  if (cloudPending) {
    try {
      fetch(SUPABASE_URL + "/bossquest_saves", {
        method: "POST",
        headers: supabaseHeaders({ "Prefer": "resolution=merge-duplicates" }),
        body: JSON.stringify({ id: getOrCreateSaveId(), data: state, updated_at: new Date().toISOString() }),
        keepalive: true
      }).catch(() => {});
    } catch (e) {}
  }
});

applyTheme(currentTheme());
render();
initSync();
cloudInit();
</script>
</body>
</html>
