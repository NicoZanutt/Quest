<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quest</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  [hidden] { display: none !important; }

  :root {
    --bg: #0e1016;
    --card: #171a24;
    --card2: #1e2230;
    --border: #2a2f42;
    --text: #e8eaf2;
    --muted: #8b90a5;
    --accent: #8b5cf6;
    --accent2: #ec4899;
    --accent-deep: #6d28d9;
    --soft: #c4b5fd;
    --line: #1f2333;
    --bar-bg: #12141d;
    --check-mark: #0e1016;
    --header1: #171a24;
    --header2: #1d1530;
    --overlay: rgba(5, 6, 10, 0.75);
    --accent-soft: rgba(139, 92, 246, 0.15);
    --accent-softer: rgba(139, 92, 246, 0.12);
    --accent2-soft: rgba(236, 72, 153, 0.15);
    --tag1-bg: #2c3145;
    --tag1-tx: #9aa1bd;
    --tag2-bg: #3d2f14;
    --tag2-tx: #f39c12;
    --tag3-bg: #3b1d3f;
    --tag3-tx: #e879f9;
    --imp1: #9aa1bd;
    --imp2: #f39c12;
    --imp3: #e879f9;
    --btn-tx: #ffffff;
    --toast-tx: #ffffff;
    --badge-tx: #ffffff;
    --red: #e74c3c;
    --orange: #f39c12;
    --yellow: #f1c40f;
    --green: #2ecc71;
  }

  body.theme-gold {
    --bg: #faf6ec; --card: #ffffff; --card2: #f5efe0; --border: #e3d9bf;
    --text: #33291a; --muted: #9a8b6a;
    --accent: #b8901f; --accent2: #e3c05a; --accent-deep: #93731a; --soft: #a8811c;
    --line: #eee6d2; --bar-bg: #f0ead8; --check-mark: #faf6ec;
    --header1: #ffffff; --header2: #f5edda;
    --overlay: rgba(60, 50, 20, 0.35);
    --accent-soft: rgba(184, 144, 31, 0.14);
    --accent-softer: rgba(184, 144, 31, 0.10);
    --accent2-soft: rgba(227, 192, 90, 0.14);
    --tag1-bg: #efeadb; --tag1-tx: #7d7358;
    --tag2-bg: #faeed3; --tag2-tx: #b96e00;
    --tag3-bg: #f9e8f4; --tag3-tx: #b0329a;
    --imp1: #8a90a5; --imp2: #d68910; --imp3: #c026a8;
    --btn-tx: #ffffff; --toast-tx: #ffffff; --badge-tx: #ffffff;
    --red: #ff5a5a; --orange: #ff9d45; --yellow: #ffe14d; --green: #4de07a;
  }

  body.theme-arcade {
    --bg: #0b0714; --card: #151022; --card2: #1d1631; --border: #322552;
    --text: #eae6ff; --muted: #8f84b8;
    --accent: #00e5ff; --accent2: #ff2fb0; --accent-deep: #00b8cc; --soft: #7ff3ff;
    --line: #241a3d; --bar-bg: #100b1d; --check-mark: #0b0714;
    --header1: #151022; --header2: #2a0f33;
    --overlay: rgba(5, 3, 12, 0.8);
    --accent-soft: rgba(0, 229, 255, 0.12);
    --accent-softer: rgba(0, 229, 255, 0.09);
    --accent2-soft: rgba(255, 47, 176, 0.12);
    --tag1-bg: #242a45; --tag1-tx: #9aa1bd;
    --tag2-bg: #3d2f14; --tag2-tx: #ffb400;
    --tag3-bg: #3b1d3f; --tag3-tx: #ff5cd0;
    --imp1: #9aa1bd; --imp2: #ffb400; --imp3: #ff5cd0;
    --btn-tx: #071018; --toast-tx: #071018; --badge-tx: #071018;
  }

  body.theme-playfight {
    --bg: #160c0a; --card: #20120e; --card2: #2b1913; --border: #46281e;
    --text: #f5e9e4; --muted: #a98879;
    --accent: #ff5a3c; --accent2: #ffb454; --accent-deep: #d63a1e; --soft: #ffb454;
    --line: #2e1b14; --bar-bg: #1c0f0b; --check-mark: #160c0a;
    --header1: #20120e; --header2: #331a12;
    --overlay: rgba(10, 4, 3, 0.75);
    --accent-soft: rgba(255, 90, 60, 0.13);
    --accent-softer: rgba(255, 90, 60, 0.10);
    --accent2-soft: rgba(255, 180, 84, 0.13);
    --tag1-bg: #3a2a24; --tag1-tx: #c4a99b;
    --tag2-bg: #40260f; --tag2-tx: #ff9d45;
    --tag3-bg: #401d18; --tag3-tx: #ff7a5c;
    --imp1: #c4a99b; --imp2: #ff9d45; --imp3: #ff6a4d;
    --btn-tx: #ffffff; --toast-tx: #ffffff; --badge-tx: #ffffff;
  }

  body.theme-forest {
    --bg: #0c1410; --card: #122019; --card2: #182a20; --border: #27402f;
    --text: #e8f2ea; --muted: #87a58f;
    --accent: #3ddc84; --accent2: #a3e635; --accent-deep: #22a35f; --soft: #8fe6b8;
    --line: #1a2a20; --bar-bg: #0f1a14; --check-mark: #0c1410;
    --header1: #122019; --header2: #14301f;
    --overlay: rgba(4, 10, 6, 0.75);
    --accent-soft: rgba(61, 220, 132, 0.12);
    --accent-softer: rgba(61, 220, 132, 0.09);
    --accent2-soft: rgba(163, 230, 53, 0.12);
    --tag1-bg: #24352a; --tag1-tx: #9ab8a2;
    --tag2-bg: #3a3010; --tag2-tx: #e8c545;
    --tag3-bg: #3a1f33; --tag3-tx: #f18fd0;
    --imp1: #9ab8a2; --imp2: #e8c545; --imp3: #f18fd0;
    --btn-tx: #07271a; --toast-tx: #07271a; --badge-tx: #07271a;
  }

  body.theme-sky {
    --bg: #f2f6fb; --card: #ffffff; --card2: #e9f0f8; --border: #d3e0ee;
    --text: #1f2d3d; --muted: #6b7f95;
    --accent: #2f7ef7; --accent2: #6db3ff; --accent-deep: #1c5ed8; --soft: #2a6fd6;
    --line: #e6eef7; --bar-bg: #e3ecf6; --check-mark: #f2f6fb;
    --header1: #ffffff; --header2: #e8f2fd;
    --overlay: rgba(25, 40, 60, 0.35);
    --accent-soft: rgba(47, 126, 247, 0.12);
    --accent-softer: rgba(47, 126, 247, 0.09);
    --accent2-soft: rgba(109, 179, 255, 0.12);
    --tag1-bg: #e8edf3; --tag1-tx: #5c718a;
    --tag2-bg: #fdeeda; --tag2-tx: #b06a00;
    --tag3-bg: #f3e6fd; --tag3-tx: #8d3fd1;
    --imp1: #5c718a; --imp2: #d68910; --imp3: #9b4de0;
    --btn-tx: #ffffff; --toast-tx: #ffffff; --badge-tx: #ffffff;
  }

  body.theme-pixel {
    --bg: #0d0b1e; --card: #1a1530; --card2: #241d42; --border: #4a3f78;
    --text: #e8e4d8; --muted: #8d86b8;
    --accent: #f0b429; --accent2: #7bd8ff; --accent-deep: #c98a12; --soft: #ffe08a;
    --line: #2b2448; --bar-bg: #120f26; --check-mark: #0d0b1e;
    --header1: #1a1530; --header2: #2e1d4a;
    --overlay: rgba(4, 3, 12, 0.85);
    --accent-soft: rgba(240, 180, 41, 0.14);
    --accent-softer: rgba(240, 180, 41, 0.10);
    --accent2-soft: rgba(123, 216, 255, 0.12);
    --tag1-bg: #2e2850; --tag1-tx: #a8a0d0;
    --tag2-bg: #4a3810; --tag2-tx: #f0b429;
    --tag3-bg: #3a2050; --tag3-tx: #c58aff;
    --imp1: #a8a0d0; --imp2: #f0b429; --imp3: #c58aff;
    --btn-tx: #1a1206; --toast-tx: #1a1206; --badge-tx: #1a1206;
    --red: #ff5a5a; --orange: #ff9d45; --yellow: #ffe14d; --green: #4de07a;
  }

  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 60px;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: linear-gradient(135deg, var(--header1) 0%, var(--header2) 100%);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
  }

  .logo {
    font-weight: 800;
    font-size: 20px;
    letter-spacing: 1px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    white-space: nowrap;
  }

  .player-info {
    flex: 1;
    min-width: 260px;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .level-badge {
    background: linear-gradient(135deg, var(--accent), var(--accent-deep));
    color: var(--badge-tx);
    border-radius: 12px;
    padding: 8px 14px;
    text-align: center;
    line-height: 1.15;
    min-width: 64px;
  }
  .level-badge .lvl { font-size: 11px; opacity: 0.85; }
  .level-badge .num { font-size: 20px; font-weight: 800; }

  .xp-wrap { flex: 1; }
  .title-row {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    margin-bottom: 5px;
  }
  .title-row .title { color: var(--soft); font-weight: 600; }
  .title-row .xp-count { color: var(--muted); }

  .bar {
    height: 14px;
    background: var(--bar-bg);
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .bar > div {
    height: 100%;
    border-radius: 8px;
    transition: width 0.5s ease, background 0.5s ease;
  }
  .fill-xp { background: linear-gradient(90deg, var(--accent), var(--accent2)); }

  .ach-btn {
    background: var(--card2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 8px 14px;
    cursor: pointer;
    font-size: 14px;
    transition: border-color 0.2s;
  }
  .ach-btn:hover { border-color: var(--accent); }
  .ach-btn.sync-ok { border-color: var(--green); }
  .ach-btn.sync-err { border-color: var(--red); }

  main { max-width: 900px; margin: 0 auto; padding: 24px 20px; }

  .section-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 10px 0 16px;
  }
  .section-title h2 { font-size: 18px; }
  .section-title h2 .cat-dot { margin-right: 8px; vertical-align: -1px; }
  .cat-total { color: var(--muted); font-size: 13px; font-weight: 600; white-space: nowrap; }

  .btn {
    background: linear-gradient(135deg, var(--accent), var(--accent-deep));
    color: var(--btn-tx);
    border: none;
    border-radius: 10px;
    padding: 9px 16px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.2s;
  }
  .btn:hover { opacity: 0.9; }
  .btn:active { transform: scale(0.97); }
  .btn.secondary {
    background: var(--card2);
    border: 1px solid var(--border);
    color: var(--text);
  }
  .btn.danger { background: linear-gradient(135deg, #c0392b, #922b21); }
  .btn.small { padding: 5px 10px; font-size: 12px; }

  .new-quest-wrap { position: relative; display: flex; gap: 6px; }
  .quest-caret { padding: 9px 10px; }
  .parch-menu {
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    min-width: 280px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 12px 32px var(--overlay);
    padding: 6px;
    z-index: 60;
  }
  .parch-head { padding: 8px 10px 6px; font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: 0.03em; }
  .parch-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
    color: var(--text);
  }
  .parch-item:hover { background: var(--accent-soft); }
  .parch-name { flex: 1; font-size: 14px; font-weight: 600; }
  .parch-count { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .parch-del {
    border: none;
    background: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 13px;
    padding: 3px 6px;
    border-radius: 6px;
    line-height: 1;
  }
  .parch-del:hover { color: var(--red); background: var(--accent-softer); }
  .parch-empty { padding: 10px; font-size: 13px; color: var(--muted); line-height: 1.5; }
  .parch-menu-sep { height: 1px; background: var(--border); margin: 6px 4px; }
  .arch-item { border: 1px solid var(--border); border-radius: 10px; margin: 8px; overflow: hidden; }
  .arch-head { display: flex; align-items: center; gap: 10px; padding: 10px 12px; cursor: pointer; }
  .arch-head:hover { background: var(--accent-soft); }
  .arch-name { flex: 1; font-weight: 700; font-size: 14px; color: var(--text); }
  .arch-meta { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .arch-date { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .arch-detail { padding: 10px 12px 12px; border-top: 1px solid var(--border); }
  .arch-task { font-size: 13px; padding: 3px 0; color: var(--muted); }
  .arch-task.ok { color: var(--text); }
  .arch-actions { display: flex; gap: 8px; margin-top: 10px; }
  .quest-filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 16px; }
  .qf-chip {
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .qf-chip:hover { border-color: var(--accent); }
  .qf-chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .qf-count { color: var(--muted); font-weight: 500; }
  .qf-chip.on .qf-count { color: var(--accent); opacity: 0.7; }
  .obj-type {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.02em;
    padding: 2px 9px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
    margin: 2px 0 6px;
  }
  .stats .obj-type { margin: 0; }

  .time-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 18px;
    margin: 26px 0;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    transition: border-color 0.2s, transform 0.15s;
  }
  .time-box:hover { border-color: var(--accent); transform: translateY(-1px); }
  .time-box .tb-big { font-size: 22px; font-weight: 800; color: var(--accent); }
  .time-box .tb-sub { color: var(--muted); font-size: 13px; margin-top: 3px; }
  .time-box .tb-arrow { color: var(--muted); font-size: 18px; }
  .chron-hero {
    background: var(--card);
    border: 1px solid var(--accent);
    border-radius: 14px;
    padding: 26px 22px;
    margin-bottom: 22px;
    text-align: center;
  }
  .chron-hero .ch-time { font-size: 42px; font-weight: 800; }
  .chron-hero .ch-meta { color: var(--muted); margin-top: 6px; font-size: 14px; }
  .chron-year {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 0;
    border-bottom: 1px solid var(--line);
  }
  .chron-year:last-child { border-bottom: none; }
  .chron-year .cy-label { font-weight: 800; width: 64px; font-size: 17px; }
  .chron-year .cy-bar { flex: 1; }
  .chron-year .cy-stats { font-size: 13px; color: var(--muted); text-align: right; white-space: nowrap; }
  .chron-delta { font-weight: 700; font-size: 13px; }
  .chron-delta.up { color: var(--green); }
  .chron-delta.down { color: var(--red); }
  .chron-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 6px 18px;
  }
  .chron-select {
    background: var(--card2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 13px;
    cursor: pointer;
  }
  .cs-cat {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 10px;
  }
  .cs-cat summary {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    list-style: none;
    font-weight: 700;
    font-size: 15px;
  }
  .cs-cat-head { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .cs-cat-name { overflow-wrap: anywhere; }
  .cs-cat-edit {
    border: none;
    background: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 12px;
    padding: 3px 6px;
    border-radius: 6px;
    flex-shrink: 0;
  }
  .cs-cat-edit:hover { color: var(--accent); background: var(--accent-soft); }
  .cs-cat summary::-webkit-details-marker { display: none; }
  .cs-cat summary::before { content: "▸"; color: var(--muted); margin-right: 8px; transition: transform 0.15s; }
  .cs-cat[open] summary::before { transform: rotate(90deg); }
  .cs-cat-bar { margin: 10px 0 4px; }
  .cs-task {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 7px 0 7px 18px;
    border-bottom: 1px solid var(--line);
    font-size: 13.5px;
  }
  .cs-task:last-child { border-bottom: none; }
  .cs-task-name { color: var(--text); }
  .cs-task-time { color: var(--muted); white-space: nowrap; }
  .cs-cat-time { color: var(--accent); white-space: nowrap; font-size: 14px; }

  .mission-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .mission-card h3 { font-size: 15px; line-height: 1.3; }
  .mc-time { font-size: 24px; font-weight: 800; color: var(--accent); }
  .mc-time .never { color: var(--muted); font-size: 15px; font-weight: 600; }
  .mc-stats { display: flex; gap: 10px; color: var(--muted); font-size: 12.5px; flex-wrap: wrap; }
  .mc-meta { display: flex; gap: 8px; font-size: 12px; color: var(--muted); flex-wrap: wrap; align-items: center; }
  .mc-cat {
    background: var(--tag1-bg);
    color: var(--tag1-tx);
    padding: 2px 8px;
    border-radius: 6px;
  }
  .mission-card .btn { margin-top: 8px; align-self: flex-start; }

  .mp-toggle {
    color: var(--accent);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    margin: -6px 0 10px;
  }
  .mp-toggle:hover { text-decoration: underline; }
  .mp-list {
    max-height: 220px;
    overflow-y: auto;
    overscroll-behavior: contain;
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 10px;
    background: var(--card2);
  }
  .mp-cat {
    padding: 8px 12px 4px;
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .mp-item {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 7px 12px;
    cursor: pointer;
    font-size: 13.5px;
  }
  .mp-item:hover { background: var(--accent-soft); }
  .mp-time { color: var(--muted); white-space: nowrap; font-size: 12.5px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }

  .obj-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    cursor: pointer;
    transition: border-color 0.2s, transform 0.15s;
    position: relative;
  }
  .obj-card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .obj-card.drag-above { box-shadow: 0 -3px 0 var(--accent); }
  .obj-card.drag-below { box-shadow: 0 3px 0 var(--accent); }
  .obj-card[draggable="true"] { cursor: grab; }
  .obj-card[draggable="true"]:active { cursor: grabbing; }
  .obj-card h3 { font-size: 16px; margin-bottom: 12px; padding-right: 46px; }
  .obj-card .stats {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--muted);
    margin-top: 8px;
  }
  .obj-card .pct {
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 8px;
  }

  .fill-red { background: linear-gradient(90deg, #c0392b, var(--red)); }
  .fill-orange { background: linear-gradient(90deg, #d35400, var(--orange)); }

  body.theme-gold .obj-card,

 </style>

<body>

</header>

<main>
  <section id="viewHome">
    <div class="section-title">
      <h2>🎯 Quêtes</h2>
      <div class="new-quest-wrap">
        <button class="btn" onclick="openObjectiveModal()">+ Nouvelle quête</button>
        <button class="btn quest-caret" onclick="toggleParchMenu(event)" title="Lancer depuis un parchemin">▾</button>
        <div class="parch-menu" id="parchMenu" hidden></div>
      </div>
    </div>
    <div id="questFilters" class="quest-filters"></div>
    <div class="grid" id="objGrid"></div>
    <div class="time-box" id="timeBox" onclick="goChroniques()" title="Voir les Chroniques du temps"></div>
    <div id="bgSection"></div>
    <div id="homeLog"></div>
  </section>

  <section id="viewDetail" hidden>
    <button class="back-link" onclick="goHome()">← Retour aux quêtes</button>

    <button class="back-link" onclick="goHome()">← Retour aux quêtes</button>
    <div id="chronContent"></div>
  </section>

  <section id="viewMissions" hidden>
    <button class="back-link" onclick="goHome()">← Retour aux quêtes</button>

  <footer>
    Données stockées localement dans ce navigateur ·
    <button onclick="exportData()">Exporter</button> ·

    <input type="file" id="importFile" accept=".json" hidden onchange="importData(event)">
  </footer>
</main>

<div class="overlay" id="overlay" hidden>
  <div class="modal" id="modalBox"></div>
</div>

<div id="toasts"></div>

<script>
"use strict";

const STORAGE_KEY = "bossquest-data-v1";

const TITLES = {
  1: "Novice",
  2: "Apprenti",
  3: "Explorateur",
  4: "Aventurier",
  5: "Joueur aguerri",
  6: "Stratège",
  7: "Combattant",
  8: "Chevalier du jeu",
  9: "Champion",
  10: "Maître de jeu",
  12: "Architecte du jeu",
  15: "Boss final",
  20: "Légende vivante"
};

const IMPORTANCE = {
  1: { label: "Peu important", icon: "🕓", examples: "trier des emails" },
  2: { label: "Moyen", icon: "⚔️", examples: "compta, inscrits, messages" },
  3: { label: "Prioritaire", icon: "👑", examples: "marketing, copy, stages" }
};

const ACHIEVEMENTS = [
  { id: "first", icon: "👣", name: "Premier pas", desc: "Cocher sa première mission", test: s => s.log.length >= 1 },
  { id: "ten", icon: "🔥", name: "En roue libre", desc: "10 missions terminées", test: s => s.log.length >= 10 },
  { id: "hundred", icon: "💯", name: "Centurion", desc: "100 missions terminées", test: s => s.log.length >= 100 },
  { id: "obj1", icon: "🎯", name: "Quête accomplie", desc: "Terminer une quête à 100%", test: s => completedObjectives(s) >= 1 },
  { id: "obj3", icon: "🏰", name: "Grand stratège", desc: "Terminer 3 quêtes à 100%", test: s => completedObjectives(s) >= 3 },
  { id: "xp1k", icon: "⭐", name: "Mille XP", desc: "Atteindre 1000 XP", test: s => s.xp >= 1000 },
  { id: "xp10k", icon: "🌟", name: "Dix mille XP", desc: "Atteindre 10000 XP", test: s => s.xp >= 10000 },
  { id: "marathon", icon: "🏃", name: "Marathon", desc: "Une mission de 90 minutes ou plus", test: s => s.log.some(e => e.minutes >= 90) },
  { id: "sprint", icon: "⚡", name: "Sprint", desc: "5 missions terminées dans la même journée", test: s => maxTasksPerDay(s) >= 5 },
  { id: "multi", icon: "🤹", name: "Multicartes", desc: "De l'XP gagné dans 3 quêtes différentes", test: s => new Set(s.log.map(e => e.objectiveId)).size >= 3 },
  { id: "bg20", icon: "⚙️", name: "Intendant", desc: "20 missions de fond accomplies", test: s => s.log.filter(e => e.objectiveId === "background").length >= 20 },
  { id: "parch", icon: "📜", name: "Archiviste", desc: "Mettre une quête en parchemin", test: s => s.parchemins.length >= 1 },
  { id: "lvl5", icon: "🛡️", name: "Niveau 5", desc: "Atteindre le niveau 5", test: s => levelInfo(s.xp).level >= 5 },
  { id: "lvl10", icon: "👑", name: "Niveau 10", desc: "Atteindre le niveau 10", test: s => levelInfo(s.xp).level >= 10 }
];

const THEMES = [
  { id: "default", name: "Nuit violette", desc: "Le donjon original", sw: ["#8b5cf6", "#ec4899", "#0e1016"] },
  { id: "gold", name: "Blanc et Or", desc: "Donjon de marbre et trésors", sw: ["#b8901f", "#e3c05a", "#faf6ec"] },
  { id: "arcade", name: "Arcade néon", desc: "Cour de récré des années 90", sw: ["#00e5ff", "#ff2fb0", "#0b0714"] },
  { id: "playfight", name: "Playfight", desc: "Énergie de combat", sw: ["#ff5a3c", "#ffb454", "#160c0a"] },
  { id: "forest", name: "Forêt", desc: "Fraîcheur nature", sw: ["#3ddc84", "#a3e635", "#0c1410"] },
  { id: "sky", name: "Ciel clair", desc: "Légèreté bleue", sw: ["#2f7ef7", "#6db3ff", "#f2f6fb"] },
  { id: "pixel", name: "Donjon 8-bit", desc: "Pixel art héroïque, or et donjon", sw: ["#f0b429", "#7bd8ff", "#0d0b1e"] }
];

const THEME_KEY = "bossquest-theme";

function currentTheme() {
  return localStorage.getItem(THEME_KEY) || "default";
}

function applyTheme(id) {
  document.body.classList.remove("theme-default", "theme-gold", "theme-arcade", "theme-playfight", "theme-forest", "theme-sky", "theme-pixel");
  if (id && id !== "default") document.body.classList.add("theme-" + id);
}

function setTheme(id) {
  applyTheme(id);
  localStorage.setItem(THEME_KEY, id);
  openThemes();
}

function openThemes() {
  const cur = currentTheme();
  const rows = THEMES.map(t =>
    "<li class='" + (cur === t.id ? "active" : "") + "' onclick=\"setTheme('" + t.id + "')\">" +
    "<span class='sw'>" + t.sw.map(c => "<span class='sw-dot' style='background:" + c + "'></span>").join("") + "</span>" +
    "<span><span class='ach-name'>" + t.name + "</span><br><span class='ach-desc'>" + t.desc + "</span></span>" +
    "<span class='ach-date'>" + (cur === t.id ? "✔ actif" : "") + "</span>" +
    "</li>"
  ).join("");
  openModal(
    "<h3>🎨 Thèmes</h3>" +
    "<ul class='ach-list theme-list'>" + rows + "</ul>" +
    "<p class='hint'>Clique pour essayer, ça change tout de suite. Le choix est mémorisé.</p>" +
    "<div class='modal-actions'><button class='btn' onclick='closeModal()'>Fermer</button></div>"
  );
}

let state = loadState();
let currentView = "home";

function defaultState() {
  return { xp: 0, objectives: [], background: [], log: [], unlocked: {}, parchemins: [], archive: [] };
}

function normalizeState(s) {
  const normItems = t => {
    t.items = (Array.isArray(t.items) ? t.items : [])
      .filter(it => it && it.name)
      .map(it => ({ id: it.id || uid(), name: String(it.name), done: !!it.done }));
    t.monster = !!t.monster;
    return t;
  };
  return {
    xp: s.xp || 0,
    objectives: Array.isArray(s.objectives) ? s.objectives.map(o => {
      if (Array.isArray(o.tasks)) o.tasks.forEach(normItems);
      o.cat = String(o.cat || "");
      return o;
    }) : [],
    background: Array.isArray(s.background) ? s.background.map(normItems) : [],
    log: Array.isArray(s.log) ? s.log : [],
    unlocked: s.unlocked || {},
    parchemins: Array.isArray(s.parchemins) ? s.parchemins : [],
    archive: Array.isArray(s.archive) ? s.archive.map(o => {
      if (Array.isArray(o.tasks)) o.tasks.forEach(normItems);
      o.cat = String(o.cat || "");
      return o;
    }) : [],
    updatedAt: s.updatedAt || ""
  };
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultState();
    return normalizeState(JSON.parse(raw));
  } catch (e) {
    return defaultState();
  }
}

function saveState() {
  state.updatedAt = new Date().toISOString();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  scheduleSync();
  scheduleCloudPush();
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function lastLogIndexOf(taskId) {
  for (let i = state.log.length - 1; i >= 0; i--) {
    if (state.log[i].taskId === taskId) return i;
  }
  return -1;
}

function xpRate(task) {
  return task.monster ? 10 : task.imp;
}

function levelThreshold(level) {
  return 50 * level * (level - 1);
}

function levelInfo(xp) {
  let level = 1;
  while (xp >= levelThreshold(level + 1)) level++;
  const cur = levelThreshold(level);
  const need = levelThreshold(level + 1) - cur;
  const done = xp - cur;
  const pct = Math.min(100, Math.round((done / need) * 100));
  return { level, need, done, pct };
}

function titleFor(level) {
  let t = TITLES[1];
  const keys = Object.keys(TITLES).map(Number).sort((a, b) => a - b);
  for (const k of keys) if (level >= k) t = TITLES[k];
  return t;
}

function esc(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function completedObjectives(s) {
  const all = s.objectives.concat(Array.isArray(s.archive) ? s.archive : []);
  return all.filter(o => o.tasks.length > 0 && o.tasks.every(t => t.done)).length;
}

function maxTasksPerDay(s) {
  const counts = {};
  for (const e of s.log) {
    const day = e.date.slice(0, 10);
    counts[day] = (counts[day] || 0) + 1;
  }
  return Object.values(counts).reduce((m, c) => Math.max(m, c), 0);
}

function objectiveStats(obj) {
  const total = obj.tasks.length;
  const done = obj.tasks.filter(t => t.done).length;
  const xp = obj.tasks.reduce((sum, t) => sum + (t.done ? t.xp : 0), 0);
  const pct = total === 0 ? 0 : Math.round((done / total) * 100);
  return { total, done, xp, pct };
}

function fillClass(pct) {
  if (pct >= 100) return "fill-complete";
  if (pct >= 75) return "fill-green";
  if (pct >= 50) return "fill-yellow";
  if (pct >= 25) return "fill-orange";
  return "fill-red";
}

const CAT_COLORS = ["#8b5cf6", "#ec4899", "#f39c12", "#2ecc71", "#3498db", "#e74c3c"];

function catColor(name) {
  let h = 0;
  for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return CAT_COLORS[h % CAT_COLORS.length];
}

function allCategories() {
  const set = new Set();
  state.objectives.forEach(o => o.tasks.forEach(t => { if (t.cat) set.add(t.cat); }));
  state.background.forEach(t => { if (t.cat) set.add(t.cat); });
  return Array.from(set).sort((a, b) => a.localeCompare(b, "fr"));
}

function allQuestCats() {
  const set = new Set();
  state.objectives.forEach(o => { if (o.cat) set.add(o.cat); });
  (state.archive || []).forEach(o => { if (o.cat) set.add(o.cat); });
  return Array.from(set).sort((a, b) => a.localeCompare(b, "fr"));
}

function groupByCat(tasks) {
  const map = {};
  for (const t of tasks) {
    const c = t.cat || "";
    (map[c] = map[c] || []).push(t);
  }
  return Object.keys(map).sort((a, b) => {
    if (a === "") return 1;
    if (b === "") return -1;
    return a.localeCompare(b, "fr");
  }).map(cat => ({ cat, tasks: map[cat] }));
}

function catStats(obj, cat) {
  const all = obj.tasks.filter(t => (t.cat || "") === cat);
  const done = all.filter(t => t.done);
  const xp = done.reduce((sum, t) => sum + t.xp, 0);
  const pct = all.length === 0 ? 0 : Math.round((done.length / all.length) * 100);
  return { total: all.length, done: done.length, xp, pct };
}

function catGroupHtml(obj, tasks, cat, isDone) {
  const st = catStats(obj, cat);
  const label = cat === "" ? "Sans catégorie" : cat;
  const color = cat === "" ? "#8b90a5" : catColor(cat);
  let html = "<div class='cat-group' data-cat=\"" + esc(cat) + "\" " +
    "ondragover='dragOverCat(event)' ondragenter='dragEnterCat(event)' ondragleave='dragLeaveCat(event)' " +
    "ondrop='dropOnCat(event,\"" + obj.id + "\")'>" +
    "<div class='cat-header'>" +
    "<span class='cat-dot' style='background:" + color + "'></span>" +
    "<span>" + esc(label) + "</span>" +
    (isDone
      ? "<span class='cat-stats'>" + st.xp + " XP</span>"
      : "<span class='cat-stats'>" + st.done + "/" + st.total + " · " + st.xp + " XP</span>" +
        "<div class='bar cat-bar'><div style='width:" + st.pct + "%;background:" + color + "'></div></div>") +
    "</div>";
  html += "<ul class='task-list'>" + tasks.map(t => taskItem(obj.id, t)).join("") + "</ul>";
  html += "</div>";
  return html;
}

function emptyCatDropZone(objId) {
  return "<div class='cat-group drop-empty' data-cat=\"\" " +
    "ondragover='dragOverCat(event)' ondragenter='dragEnterCat(event)' ondragleave='dragLeaveCat(event)' " +
    "ondrop='dropOnCat(event,\"" + objId + "\")'>" +
    "<div class='cat-header'>" +
    "<span class='cat-dot' style='background:#8b90a5'></span>" +
    "<span>Sans catégorie</span>" +
    "</div>" +
    "<div class='drop-hint'>Dépose une mission ici pour retirer sa catégorie</div>" +
    "</div>";
}

window._drag = null;

function dragTask(e, objId, taskId) {
  window._drag = { objId, taskId };
  e.dataTransfer.effectAllowed = "move";
  e.dataTransfer.setData("text/plain", taskId);
}

function dragEnd() {
  window._drag = null;
  document.querySelectorAll(".drag-over").forEach(el => el.classList.remove("drag-over"));
}

function dragOverCat(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = "move";
}

function dragEnterCat(e) {
  if (e.currentTarget.contains(e.relatedTarget)) return;
  e.currentTarget.classList.add("drag-over");
}

function dragLeaveCat(e) {
  if (e.currentTarget.contains(e.relatedTarget)) return;
  e.currentTarget.classList.remove("drag-over");
}

function dropOnCat(e, objId) {
  e.preventDefault();
  const info = window._drag;
  dragEnd();
  if (!info) return;
  const cat = e.currentTarget.getAttribute("data-cat") || "";
  const obj = state.objectives.find(o => o.id === objId);
  const task = obj ? obj.tasks.find(t => t.id === info.taskId) : null;
  if (!task) return;
  if ((task.cat || "") === cat) return;
  task.cat = cat;
  saveState();
  render();
  toast("↪ " + task.name + " → " + (cat === "" ? "Sans catégorie" : cat), false);
}

function render() {
  renderHeader();
  const home = document.getElementById("viewHome");
  const detail = document.getElementById("viewDetail");
  const timeline = document.getElementById("viewTimeline");
  const chroniques = document.getElementById("viewChroniques");
  const missions = document.getElementById("viewMissions");
  if (currentView === "home") {
    home.hidden = false;
    detail.hidden = true;
    timeline.hidden = true;
    chroniques.hidden = true;
    missions.hidden = true;
    renderHome();
  } else if (currentView === "timeline") {
    home.hidden = true;
    detail.hidden = true;
    timeline.hidden = false;
    chroniques.hidden = true;
    missions.hidden = true;
    renderTimeline();
  } else if (currentView === "chroniques") {
    home.hidden = true;
    detail.hidden = true;
    timeline.hidden = true;
    chroniques.hidden = false;
    missions.hidden = true;
    renderChroniques();
  } else if (currentView === "missions") {
    home.hidden = true;
    detail.hidden = true;
    timeline.hidden = true;
    chroniques.hidden = true;
    missions.hidden = false;
    renderMissions();
  } else {
    home.hidden = true;
    detail.hidden = false;
    timeline.hidden = true;
    chroniques.hidden = true;
    missions.hidden = true;
    renderDetail(currentView);
  }
}

let questCatFilter = "";

function jsq(s) {
  return String(s).replace(/\\/g, "\\\\").replace(/'/g, "\\'");
}

function renderQuestFilters() {
  const box = document.getElementById("questFilters");
  if (!box) return;
  if (state.objectives.length === 0) { box.innerHTML = ""; return; }
  const counts = {};
  let none = 0;
  state.objectives.forEach(o => { if (o.cat) counts[o.cat] = (counts[o.cat] || 0) + 1; else none++; });
  const cats = Object.keys(counts).sort((a, b) => a.localeCompare(b, "fr"));
  const chip = (val, label, count) =>
    "<button class='qf-chip" + (questCatFilter === val ? " on" : "") + "' onclick=\"setQuestCatFilter('" + jsq(val) + "')\">" +
    esc(label) + " <span class='qf-count'>" + count + "</span></button>";

  cats.forEach(c => { html += chip(c, c, counts[c]); });
  if (none > 0) html += chip("__none", "Sans catégorie", none);
  box.innerHTML = html;
}

function setQuestCatFilter(v) {

  render();
}

function renderHome() {

function renderHomeLog() {

        ? "Intendance"
        : ((state.objectives.find(o => o.id === e.objectiveId) || {}).name || "");

        "<span><span class='gain'>+" + e.xp + " XP</span> <span class='when'>· " + e.minutes + " min × " + e.mult + " · " + formatDate(e.date) + "</span></span></div>";

function formatDate(iso) {
  const d = new Date(iso);
  const today = new Date();
  const isToday = d.toDateString() === today.toDateString();
  if (isToday) return "aujourd'hui";
  return d.toLocaleDateString("fr-FR", { day: "numeric", month: "short" });
}

function yearStats(year) {
  const entries = state.log.filter(e => new Date(e.date).getFullYear() === year);
  const minutes = entries.reduce((sum, e) => sum + e.minutes, 0);
  const xp = entries.reduce((sum, e) => sum + e.xp, 0);
  let first = null;
  for (const e of entries) {
    const d = new Date(e.date);
    if (!first || d < first) first = d;
  }
  return { minutes, xp, count: entries.length, first };
}

function fmtHours(minutes) {
  const h = Math.floor(minutes / 60);
  const m = minutes % 60;
  if (h === 0) return m + " min";
  return h + "h" + (m < 10 ? "0" + m : m);
}

function logYears() {
  const years = new Set(state.log.map(e => new Date(e.date).getFullYear()));
  years.add(new Date().getFullYear());
  return Array.from(years).sort((a, b) => b - a);
}

function renderTimeBox() {
  const box = document.getElementById("timeBox");
  const y = yearStats(new Date().getFullYear());
  if (y.count === 0) {
    box.innerHTML = "<div><div class='tb-big'>0 min</div><div class='tb-sub'>Coche ta première mission pour démarrer le compteur</div></div><span class='tb-arrow'>→</span>";
    return;
  }
  box.innerHTML = "<div><div class='tb-big'>" + fmtHours(y.minutes) + "</div>" +
    "<div class='tb-sub'>de travail en " + new Date().getFullYear() + " · compteur lancé le " +
    y.first.toLocaleDateString("fr-FR", { day: "numeric", month: "long" }) + "</div></div>" +
    "<span class='tb-arrow'>→</span>";
}

function goChroniques() {
  currentView = "chroniques";
  render();
}

function renderChroniques() {
  const box = document.getElementById("chronContent");
  const years = logYears();
  const curYear = new Date().getFullYear();
  let html = "<div class='section-title'><h2>⏱ Chroniques du temps</h2></div>";

  const cur = yearStats(curYear);
  html += "<div class='chron-hero'>" +
    "<div class='ch-time'>" + fmtHours(cur.minutes) + "</div>" +
    "<div class='ch-meta'>en " + curYear + "</div>";
  if (cur.count > 0) {
    html += "<div class='ch-meta'>" + cur.count + " missions accomplies · " + cur.xp + " XP gagnés · compteur lancé le " +
      cur.first.toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" }) + "</div>";
  } else {
    html += "<div class='ch-meta'>Le compteur démarre à ta première mission cochée</div>";
  }
  html += "</div>";

  if (years.length > 1) {
    html += "<div class='chron-box'>";
    let prev = null;
    for (const y of years.slice().reverse()) {
      const st = yearStats(y);
      const maxMin = Math.max(...years.map(w => yearStats(w).minutes), 1);
      const pct = Math.round((st.minutes / maxMin) * 100);
      let delta = "";
      if (prev && prev.minutes > 0) {
        const diff = Math.round(((st.minutes - prev.minutes) / prev.minutes) * 100);
        if (diff >= 0) delta = " <span class='chron-delta up'>+" + diff + "%</span>";
        else delta = " <span class='chron-delta down'>" + diff + "%</span>";
      }
      html += "<div class='chron-year'>" +
        "<span class='cy-label'>" + y + "</span>" +
        "<div class='cy-bar'><div class='bar'><div class='fill-xp' style='width:" + pct + "%'></div></div></div>" +
        "<div class='cy-stats'><strong>" + fmtHours(st.minutes) + "</strong> · " + st.count + " missions · " + st.xp + " XP" + delta + "</div>" +
        "</div>";
      prev = st;
    }
    html += "</div>";
  } else {
    html += "<p class='hint'>Les années précédentes apparaîtront ici, avec leur temps de travail et leur progression d'une année sur l'autre.</p>";
  }

  html += "<div class='section-title'><h2>📊 Où passe ton temps</h2>" +
    (years.length > 1
      ? "<select class='chron-select' onchange='renderCatStats(this.value)'>" +
        years.map(y => "<option value='" + y + "'" + (y === (window._chronYear || curYear) ? " selected" : "") + ">" + y + "</option>").join("") +
        "</select>"
      : "") +
    "</div>";
  html += "<div id='catStatsBox'></div>";

  box.innerHTML = html;
  renderCatStats(window._chronYear || curYear);
}

function fmtPct(part, total) {
  if (total === 0) return "0%";
  const pct = (part / total) * 100;
  if (pct > 0 && pct < 10) return pct.toFixed(1).replace(".", ",") + "%";
  return Math.round(pct) + "%";
}

function catOfEntry(e) {
  if (e.cat) return e.cat;
  for (const o of state.objectives) {
    const t = o.tasks.find(x => x.id === e.taskId);
    if (t) return t.cat || "";
  }
  const bg = state.background.find(x => x.id === e.taskId);
  if (bg) return bg.cat || "";
  return "";
}

function renderCatStats(year) {
  window._chronYear = parseInt(year, 10);
  const box = document.getElementById("catStatsBox");
  if (!box) return;
  const entries = state.log.filter(e => new Date(e.date).getFullYear() === window._chronYear);
  const total = entries.reduce((sum, e) => sum + e.minutes, 0);
  if (total === 0) {
    box.innerHTML = "<p class='hint'>Aucun temps enregistré en " + window._chronYear + ". Coche des missions pour remplir ces stats.</p>";
    return;
  }
  const cats = new Map();
  for (const e of entries) {
    const cat = catOfEntry(e) || "Sans catégorie";
    if (!cats.has(cat)) cats.set(cat, { minutes: 0, tasks: new Map() });
    const c = cats.get(cat);
    c.minutes += e.minutes;
    c.tasks.set(e.taskName, (c.tasks.get(e.taskName) || 0) + e.minutes);
  }
  const sorted = Array.from(cats.entries()).sort((a, b) => {
    if (a[0] === "Sans catégorie") return 1;
    if (b[0] === "Sans catégorie") return -1;
    return b[1].minutes - a[1].minutes;
  });
  window._chronCats = sorted.map(x => x[0]);
  box.innerHTML = sorted.map(([cat, c], i) => {
    const pct = Math.round((c.minutes / total) * 100);
    const taskRows = Array.from(c.tasks.entries()).sort((a, b) => b[1] - a[1]).map(([name, min]) =>
      "<div class='cs-task'><span class='cs-task-name'>" + esc(name) + "</span>" +
      "<span class='cs-task-time'>" + fmtHours(min) + " · " + fmtPct(min, total) + "</span></div>"
    ).join("");
    const editBtn = cat === "Sans catégorie"
      ? ""
      : "<button class='cs-cat-edit' title='Renommer cette catégorie' onclick='event.preventDefault();event.stopPropagation();openCatRename(" + i + ")'>✏️</button>";
    return "<details class='cs-cat' open>" +
      "<summary><span class='cs-cat-head'><span class='cs-cat-name'>" + esc(cat) + "</span>" + editBtn + "</span>" +
      "<span class='cs-cat-time'>" + fmtHours(c.minutes) + " · " + fmtPct(c.minutes, total) + "</span></summary>" +
      "<div class='cs-cat-bar'><div class='bar'><div class='fill-xp' style='width:" + pct + "%'></div></div></div>" +
      taskRows +
      "</details>";
  }).join("");
}

function missionIndex() {
  const map = new Map();
  const add = name => {
    if (!map.has(name)) map.set(name, { name, minutes: 0, times: 0, xp: 0, cats: new Set(), places: new Set(), todo: 0 });
    return map.get(name);
  };
  for (const e of state.log) {
    const m = add(e.taskName);
    m.minutes += e.minutes;
    m.times++;
    m.xp += e.xp;
    if (e.cat) m.cats.add(e.cat);
  }
  for (const o of state.objectives) {
    for (const t of o.tasks) {
      const m = add(t.name);
      if (!t.done) m.todo++;
      if (t.cat) m.cats.add(t.cat);
      m.places.add(o.name);
    }
  }
  for (const t of state.background) {
    const m = add(t.name);
    if (!t.done) m.todo++;
    if (t.cat) m.cats.add(t.cat);
    m.places.add("Intendance");
  }
  return Array.from(map.values()).sort((a, b) =>
    b.minutes - a.minutes || b.times - a.times || a.name.localeCompare(b.name, "fr")
  );
}

function goMissions() {
  currentView = "missions";
  render();
}

function renderMissions() {
  const box = document.getElementById("missionsContent");
  window._missions = missionIndex();
  if (window._missions.length === 0) {
    box.innerHTML = "<div class='empty'>Aucune mission pour l'instant.<br>Crée des missions dans tes quêtes et l'Intendance ⚔️</div>";
    return;
  }
  const groups = new Map();
  for (let i = 0; i < window._missions.length; i++) {
    const m = window._missions[i];
    const cat = m.cats.size === 1 ? Array.from(m.cats)[0] : "";
    if (!groups.has(cat)) groups.set(cat, []);
    groups.get(cat).push(i);
  }
  const catTime = cat => groups.get(cat).reduce((s, i) => s + window._missions[i].minutes, 0);
  const catOrder = Array.from(groups.keys()).sort((a, b) => {
    if (!a) return 1;
    if (!b) return -1;
    return catTime(b) - catTime(a);
  });
  const card = i => {
    const m = window._missions[i];
    const cat = m.cats.size === 1
      ? Array.from(m.cats)[0]
      : (m.cats.size > 1 ? m.cats.size + " catégories" : "");
    const places = m.places.size === 0
      ? "aucune quête active"
      : (m.places.size === 1 ? Array.from(m.places)[0] : m.places.size + " quêtes");
    return "<div class='mission-card'>" +
      "<h3>" + esc(m.name) + "</h3>" +
      (m.minutes > 0
        ? "<div class='mc-time'>" + fmtHours(m.minutes) + "</div>"
        : "<div class='mc-time'><span class='never'>Jamais accomplie</span></div>") +
      "<div class='mc-stats'>" +
      (m.times > 0 ? "<span>" + m.times + "×</span>" : "") +
      (m.xp > 0 ? "<span>" + m.xp + " XP</span>" : "") +
      (m.todo > 0 ? "<span>" + m.todo + " à faire</span>" : "") +
      "</div>" +
      "<div class='mc-meta'>" + (cat ? "<span class='mc-cat'>" + esc(cat) + "</span>" : "") + "<span>" + esc(places) + "</span></div>" +
      "<button class='btn secondary small' onclick='openRenameMission(" + i + ")'>✏️ Renommer</button>" +
      "</div>";
  };
  let html = "<div class='section-title'><h2>🗂️ Missions</h2></div>" +
    "<p class='hint'>Une carte par mission, où qu'elle vive (quêtes, Intendance, historique). Renomme les variantes d'une même mission pour regrouper leurs stats : si le nom existe déjà, la fusion est proposée.</p>";
  for (const cat of catOrder) {
    const color = cat === "" ? "#8b90a5" : catColor(cat);
    const label = cat === "" ? "Sans catégorie" : cat;
    html += "<div class='section-title'>" +
      "<h2><span class='cat-dot' style='background:" + color + "'></span>" + esc(label) + "</h2>" +
      "<span class='cat-total'>" + fmtHours(catTime(cat)) + "</span>" +
      "</div>" +
      "<div class='grid'>" + groups.get(cat).map(idx => card(idx)).join("") + "</div>";
  }
  box.innerHTML = html;
}

function openRenameMission(idx) {
  const m = window._missions[idx];
  if (!m) return;
  openModal(
    "<h3>✏️ Renommer la mission</h3>" +
    "<p class='hint'>Toutes les occurrences de « " + esc(m.name) + " » seront renommées, historique compris. Si une carte porte déjà ce nom, les deux seront fusionnées.</p>" +
    "<input type='text' id='mMissionName' placeholder='Nom de la mission' value='" + esc(m.name) + "'>" +
    "<div class='modal-actions'>" +
    "<button class='btn secondary' onclick='closeModal()'>Annuler</button>" +
    "<button class='btn' onclick='saveMissionRename(" + idx + ")'>Renommer</button>" +
    "</div>"
  );
  document.getElementById("mMissionName").focus();
}

function saveMissionRename(idx) {
  const m = window._missions[idx];
  if (!m) return;
  const newName = document.getElementById("mMissionName").value.trim();
  if (!newName || newName === m.name) { closeModal(); return; }
  const exists = window._missions.some(x => x.name === newName);
  if (exists) {
    window._renameCtx = { oldName: m.name, newName };
    openModal(
      "<h3>🔗 Fusionner les missions ?</h3>" +
      "<p class='hint'>Une carte « " + esc(newName) + " » existe déjà. Tout « " + esc(m.name) + " » sera regroupé dedans : temps, XP et historique s'additionnent.</p>" +
      "<div class='modal-actions'>" +
      "<button class='btn secondary' onclick='closeModal()'>Annuler</button>" +
      "<button class='btn' onclick='applyRenameCtx()'>Fusionner</button>" +
      "</div>"
    );
    return;
  }
  applyMissionRename(m.name, newName);
}

function applyRenameCtx() {
  const ctx = window._renameCtx;
  if (!ctx) return;
  applyMissionRename(ctx.oldName, ctx.newName, true);
}

function applyMissionRename(oldName, newName, fused) {
  for (const o of state.objectives) {
    for (const t of o.tasks) if (t.name === oldName) t.name = newName;
  }
  for (const t of state.background) if (t.name === oldName) t.name = newName;
  for (const e of state.log) if (e.taskName === oldName) e.taskName = newName;
  saveState();
  closeModal();
  render();
  if (fused) toast("🔗 Missions fusionnées : " + newName, true);
  else toast("✏️ Mission renommée : " + newName, false);
}

function missionPickerHtml() {
  window._pickerMissions = missionIndex();
  if (window._pickerMissions.length === 0) return "";
  const groups = new Map();
  for (let i = 0; i < window._pickerMissions.length; i++) {
    const m = window._pickerMissions[i];
    const cat = m.cats.size === 1 ? Array.from(m.cats)[0] : "";
    if (!groups.has(cat)) groups.set(cat, []);
    groups.get(cat).push(i);
  }
  const catTime = cat => groups.get(cat).reduce((s, i) => s + window._pickerMissions[i].minutes, 0);
  const catOrder = Array.from(groups.keys()).sort((a, b) => {
    if (!a) return 1;
    if (!b) return -1;
    return catTime(b) - catTime(a);
  });
  let rows = "";
  for (const cat of catOrder) {
    rows += "<div class='mp-cat'>" + (cat ? esc(cat) : "Sans catégorie") + "</div>";
    for (const i of groups.get(cat)) {
      const m = window._pickerMissions[i];
      rows += "<div class='mp-item' onclick='pickMission(" + i + ")'>" +
        "<span>" + esc(m.name) + "</span>" +
        "<span class='mp-time'>" + (m.minutes > 0 ? fmtHours(m.minutes) : "jamais") + "</span>" +
        "</div>";
    }
  }
  return "<div class='mp-toggle' onclick='toggleMissionPicker()'>📂 Réutiliser une mission existante ▾</div>" +
    "<div class='mp-list' id='missionPicker' hidden>" + rows + "</div>";
}

function toggleMissionPicker() {
  const box = document.getElementById("missionPicker");
  if (box) box.hidden = !box.hidden;
}

function pickMission(idx) {
  const m = window._pickerMissions[idx];
  if (!m) return;
  document.getElementById("mTaskName").value = m.name;
  if (m.cats.size === 1) document.getElementById("mTaskCat").value = Array.from(m.cats)[0];
  const box = document.getElementById("missionPicker");
  if (box) box.hidden = true;
}

function openCatRename(idx) {
  const cat = (window._chronCats || [])[idx];
  if (!cat || cat === "Sans catégorie") return;
  openModal(
    "<h3>✏️ Renommer la catégorie</h3>" +
    "<p class='hint'>« " + esc(cat) + " » sera renommée partout : missions, quêtes, Intendance et historique. Si une catégorie porte déjà ce nom, elles fusionneront.</p>" +
    "<input type='text' id='mCatName' placeholder='Nom de la catégorie' value='" + esc(cat) + "'>" +
    "<div class='modal-actions'>" +
    "<button class='btn secondary' onclick='closeModal()'>Annuler</button>" +
    "<button class='btn' onclick='saveCatRename(" + idx + ")'>Renommer</button>" +
    "</div>"
  );
  document.getElementById("mCatName").focus();
}

function saveCatRename(idx) {
  const oldName = (window._chronCats || [])[idx];
  if (!oldName) return;
  const newName = document.getElementById("mCatName").value.trim();
  if (!newName || newName === oldName) { closeModal(); return; }
  let fused = false;
  for (const o of state.objectives) for (const t of o.tasks) if (t.cat === newName) fused = true;
  for (const t of state.background) if (t.cat === newName) fused = true;
  for (const e of state.log) if (e.cat === newName) fused = true;
  for (const o of state.objectives) for (const t of o.tasks) if (t.cat === oldName) t.cat = newName;
  for (const t of state.background) if (t.cat === oldName) t.cat = newName;
  for (const e of state.log) if (e.cat === oldName) e.cat = newName;
  saveState();
  closeModal();
  render();
  if (fused) toast("🔗 Catégories fusionnées : " + newName, true);
  else toast("✏️ Catégorie renommée : " + newName, false);
}

function openObjective(id) {
  currentView = id;
  render();
}

function goHome() {
  currentView = "home";
  render();
}

function renderDetail(objId) {
  const obj = state.objectives.find(o => o.id === objId);
  const box = document.getElementById("detailContent");
  if (!obj) {
    currentView = "home";
    render();
    return;
  }
  const st = objectiveStats(obj);
  const todo = obj.tasks.filter(t => !t.done);
  const done = obj.tasks.filter(t => t.done);
  const hasCats = obj.tasks.some(t => t.cat);

  let html = "<div class='detail-head'>" +
    "<h2>" + esc(obj.name) +
    "<span class='head-actions'>" +
    "<button class='btn secondary small' onclick=\"openObjectiveModal('" + obj.id + "')\">✏️ Renommer</button>" +
    "<button class='btn secondary small' title='Mettre cette quête de côté, prête à rejouer' onclick=\"createParcheminFromQuest('" + obj.id + "')\">📜 Parchemin</button>" +
    "<button class='btn secondary small' title='Ranger cette quête : sort du jeu, tout est conservé' onclick=\"archiveObjective('" + obj.id + "')\">🗄️ Archiver</button>" +
    "<button class='btn secondary small' onclick=\"duplicateObjective('" + obj.id + "')\">⧉ Dupliquer</button>" +
    "<button class='btn danger small' onclick=\"confirmDeleteObjective('" + obj.id + "')\">🗑️</button>" +
    "</span></h2>" +
    "<div class='bar' style='height:18px'><div class='" + fillClass(st.pct) + "' style='width:" + st.pct + "%'></div></div>" +
    "<div class='stats'>" + (obj.cat ? "<span class='obj-type'>" + esc(obj.cat) + "</span>" : "") + "<span>" + st.done + "/" + st.total + " missions</span><span>" + st.xp + " XP gagnés sur cette quête</span></div>" +
    "</div>";

  html += "<div class='section-title'><h2>📋 À faire (" + todo.length + ")</h2>" +
    "<button class='btn' onclick=\"openTaskModal('" + obj.id + "')\">+ Nouvelle mission</button></div>";

  if (todo.length === 0) html += "<div class='empty'>Rien à faire ici. Soit c'est fini 🏆, soit il faut créer des missions.</div>";
  else if (hasCats) {
    for (const g of groupByCat(todo)) html += catGroupHtml(obj, g.tasks, g.cat, false);
    if (!todo.some(t => !t.cat)) html += emptyCatDropZone(obj.id);
  }
  else html += "<ul class='task-list'>" + todo.map(t => taskItem(obj.id, t)).join("") + "</ul>";

  if (done.length > 0) {
    html += "<div class='section-title'><h2>✅ Fait (" + done.length + ")</h2></div>";
    if (hasCats) { for (const g of groupByCat(done)) html += catGroupHtml(obj, g.tasks, g.cat, true); }
    else html += "<ul class='task-list'>" + done.map(t => taskItem(obj.id, t)).join("") + "</ul>";
  }

  box.innerHTML = html;
}

function taskItem(objId, t) {
  const imp = IMPORTANCE[t.imp];
  const open = window._openSubtasks.has(t.id);
  return "<li id='task-li-" + t.id + "' class='" + (t.done ? "done" : "") + (t.monster ? " monster" : "") + "' draggable='true' " +
    "ondragstart='dragTask(event,\"" + objId + "\",\"" + t.id + "\")' ondragend='dragEnd()'>" +
    "<div class='check' onclick=\"toggleTask('" + objId + "','" + t.id + "',event)\">✔</div>" +
    (t.monster ? "<span class='monster-chip'>👹</span>" : "") +
    "<span class='task-name' onclick=\"toggleSubtasks('" + objId + "','" + t.id + "',event)\">" + esc(t.name) + "</span>" +
    subBadge(t) +
    (t.due ? "<span class='last-done'>📅 " + shortDate(t.due) + "</span>" : "") +
    (t.done
      ? "<span class='task-xp'>+" + t.xp + " XP (" + t.minutes + " min)</span>" +
        "<button class='icon-btn' title='Remettre en jeu' onclick=\"replayTask('" + objId + "','" + t.id + "')\">↺</button>"
      : "") +
    "<span class='tag tag-" + t.imp + "'>" + (t.monster ? "💀 ×" + xpRate(t) : imp.icon + " ×" + t.imp) + "</span>" +
    "<span class='icon-btn sub-caret' title='Tâches de la mission' onclick=\"toggleSubtasks('" + objId + "','" + t.id + "',event)\">" + (open ? "▾" : "▸") + "</span>" +
    "<span class='task-actions'>" +
    "<button class='icon-btn' title='Modifier' onclick=\"openTaskModal('" + objId + "','" + t.id + "')\">✏️</button>" +
    "<button class='icon-btn' title='Supprimer' onclick=\"confirmDeleteTask('" + objId + "','" + t.id + "')\">🗑️</button>" +
    "</span>" +
    "</li>" +
    (open ? subPanelLi(objId, t) : "");
}

function closeModal() {
  document.getElementById("overlay").hidden = true;
  document.getElementById("modalBox").innerHTML = "";
}

function openModal(html) {
  document.getElementById("modalBox").innerHTML = html;
  document.getElementById("overlay").hidden = false;
}

document.getElementById("overlay").addEventListener("click", e => {
  if (e.target.id === "overlay") closeModal();
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape") { closeModal(); closeParchMenu(); }
});

document.addEventListener("click", e => {
  const menu = document.getElementById("parchMenu");
  if (menu && !menu.hidden && !menu.contains(e.target) && !e.target.closest(".quest-caret")) closeParchMenu();
});

function openObjectiveModal(objId) {
  const obj = objId ? state.objectives.find(o => o.id === objId) : null;
  openModal(
    "<h3>" + (obj ? "Renommer la quête" : "Nouvelle quête") + "</h3>" +
    "<input type='text' id='mObjName' placeholder='Ex : Remplir le stage de Toulouse' value='" + (obj ? esc(obj.name) : "") + "'>" +
    "<input type='text' id='mObjCat' list='questCatList' placeholder='Catégorie (optionnel) : stages, travail de fond...' value='" + (obj && obj.cat ? esc(obj.cat) : "") + "'>" +
    "<datalist id='questCatList'>" + allQuestCats().map(c => "<option value='" + esc(c) + "'>").join("") + "</datalist>" +
    "<p class='hint'>Une catégorie n'existe plus dès que plus aucune quête ne l'utilise.</p>" +
    "<div class='modal-actions'>" +
    "<button class='btn secondary' onclick='closeModal()'>Annuler</button>" +
    "<button class='btn' onclick='saveObjective(\"" + (objId || "") + "\")'>Enregistrer</button>" +
    "</div>"
  );
  document.getElementById("mObjName").focus();
}

function saveObjective(objId) {
  const name = document.getElementById("mObjName").value.trim();
  if (!name) return;
  const cat = (document.getElementById("mObjCat").value || "").trim();
  if (objId) {
    const obj = state.objectives.find(o => o.id === objId);
    if (obj) { obj.name = name; obj.cat = cat; }
  } else {
    state.objectives.push({ id: uid(), name, cat, tasks: [] });
    currentView = "home";
  }
  saveState();
  closeModal();
  render();
}

function openTaskModal(objId, taskId) {
  const obj = state.objectives.find(o => o.id === objId);
  if (!obj) return;
  const task = taskId ? obj.tasks.find(t => t.id === taskId) : null;
  const impChoices = impChoicesHtml(task);
  openModal(
    "<h3>" + (task ? "Modifier la mission" : "Nouvelle mission") + "</h3>" +
    "<input type='text' id='mTaskName' placeholder='La mission à accomplir' value='" + (task ? esc(task.name) : "") + "'>" +
    missionPickerHtml() +
    "<input type='text' id='mTaskCat' list='catList' placeholder='Catégorie (optionnel) : marketing, logistique...' value='" + (task && task.cat ? esc(task.cat) : "") + "'>" +
    "<datalist id='catList'>" + allCategories().map(c => "<option value='" + esc(c) + "'>").join("") + "</datalist>" +
    "<p class='hint'>Planifiée le (optionnel, apparaît dans la vue Semaine) :</p>" +
    "<input type='date' id='mTaskDue' value='" + (task && task.due ? task.due : "") + "'>" +
    "<p class='hint'>Importance : le multiplicateur appliqué à chaque minute passée.</p>" +
    "<div class='imp-grid'>" + impChoices + "</div>" +
    (task && task.done
      ? "<p class='hint'>Temps passé (modifier ajuste les XP gagnés).</p>" +
        "<input type='number' id='mTaskMinutes' min='1' step='1' value='" + task.minutes + "' placeholder='Minutes'>"
      : "") +
    "<div class='modal-actions'>" +
    "<button class='btn secondary' onclick='closeModal()'>Annuler</button>" +
    "<button class='btn' onclick='saveTask(\"" + objId + "\",\"" + (taskId || "") + "\")'>Enregistrer</button>" +
    "</div>"
  );
  document.getElementById("mTaskName").focus();
}

function impChoicesHtml(task) {
  window._taskImp = task ? task.imp : 2;
  window._taskMonster = task ? !!task.monster : false;
  const cls = i => window._taskMonster
    ? (i === 0 ? " selected-monster" : "")
    : (window._taskImp === i ? " selected-" + i : "");
  const card = (i, mult, lbl) =>
    "<div class='imp-choice" + cls(i) + (i === 0 ? " imp-monster" : "") + "' id='imp" + (i === 0 ? "M" : i) + "' onclick='" + (i === 0 ? "selectMonster()" : "selectImp(" + i + ")") + "'>" +
    "<div class='mult'>" + mult + "</div><div class='lbl'>" + lbl + "</div></div>";
  return card(1, "×1", IMPORTANCE[1].label + "<br>" + IMPORTANCE[1].examples) +
    card(2, "×2", IMPORTANCE[2].label + "<br>" + IMPORTANCE[2].examples) +
    card(3, "×3", IMPORTANCE[3].label + "<br>" + IMPORTANCE[3].examples) +
    card(0, "👹 ×10", "Monstre");
}

function selectImp(i) {
  window._taskImp = i;
  window._taskMonster = false;
  refreshRateChoices();
}

function selectMonster() {
  window._taskMonster = true;
  refreshRateChoices();
}

function refreshRateChoices() {
  [1, 2, 3].forEach(k => {
    const el = document.getElementById("imp" + k);
    if (el) el.className = "imp-choice" + (!window._taskMonster && window._taskImp === k ? " selected-" + k : "");
  });
  const m = document.getElementById("impM");
  if (m) m.className = "imp-choice imp-monster" + (window._taskMonster ? " selected-monster" : "");
}

function saveTask(objId, taskId) {
  const obj = state.objectives.find(o => o.id === objId);
  if (!obj) return;
  const name = document.getElementById("mTaskName").value.trim();
  if (!name) return;
  const cat = (document.getElementById("mTaskCat").value || "").trim();
  const due = (document.getElementById("mTaskDue").value || "").trim();
  const imp = window._taskImp;
  const monster = !!window._taskMonster;
  if (taskId) {
    const task = obj.tasks.find(t => t.id === taskId);
    if (!task) return;
    task.name = name;
    task.cat = cat;
    task.due = due;
    task.imp = imp;
    task.monster = monster;
    if (task.done) {
      const minutesEl = document.getElementById("mTaskMinutes");
      const newMinutes = Math.max(1, parseInt(minutesEl.value, 10) || 1);
      const rate = xpRate(task);
      const newXp = newMinutes * rate;
      state.xp += newXp - task.xp;
      const idx = lastLogIndexOf(taskId);
      if (idx !== -1) {
        const entry = state.log[idx];
        entry.minutes = newMinutes;
        entry.mult = rate;
        entry.xp = newXp;
        entry.taskName = name;
        entry.cat = cat;
      }
      task.minutes = newMinutes;
      task.xp = newXp;
    }
  } else {
    obj.tasks.push({ id: uid(), name, cat, due, imp, done: false, minutes: 0, xp: 0, items: [], monster });
  }
  saveState();
  closeModal();
  render();
}

function openTimeModal(objId, taskId) {
  const obj = state.objectives.find(o => o.id === objId);
  const task = obj ? obj.tasks.find(t => t.id === taskId) : null;
  if (!task) return;
  window._timeCtx = { objId, taskId, rate: xpRate(task) };
  openModal(
    "<h3>Temps de jeu ⏱️</h3>" +
    "<p class='hint'>Combien de temps as-tu passé sur « " + esc(task.name) + " » ?</p>" +
    "<input type='number' id='mMinutes' min='1' step='1' placeholder='Minutes' oninput='updateXpPreview()'>" +
    "<div class='xp-preview'>Gain : <span class='val' id='mPreview'>0 XP</span><br>" +
    "<span style='font-size:12px;color:var(--muted)'>" + (task.monster ? "👹 " + xpRate(task) + " XP par minute" : IMPORTANCE[task.imp].icon + " " + task.imp + " XP par minute") + "</span></div>" +
    "<div class='modal-actions'>" +
    "<button class='btn secondary' onclick='closeModal()'>Annuler</button>" +
    "<button class='btn' onclick='completeTask()'>✔ Valider</button>" +
    "</div>"
  );
  const input = document.getElementById("mMinutes");
  input.focus();
  input.addEventListener("keydown", e => {
    if (e.key === "Enter") completeTask();
  });
}

function updateXpPreview() {
  const minutes = parseInt(document.getElementById("mMinutes").value, 10) || 0;
  document.getElementById("mPreview").textContent = (minutes * window._timeCtx.rate) + " XP";
}

function completeTask() {
  const ctx = window._timeCtx;
  const obj = state.objectives.find(o => o.id === ctx.objId);
  const task = obj ? obj.tasks.find(t => t.id === ctx.taskId) : null;
  if (!task) { closeModal(); return; }
  const minutes = parseInt(document.getElementById("mMinutes").value, 10);
  if (!minutes || minutes < 1) return;
  const xp = minutes * xpRate(task);
  const levelBefore = levelInfo(state.xp).level;

  task.done = true;
  task.minutes = minutes;
  task.xp = xp;
  state.xp += xp;
  state.log.push({
    taskId: task.id,
    objectiveId: obj.id,
    taskName: task.name,
    cat: task.cat || "",
    minutes,
    mult: xpRate(task),
    xp,
    date: new Date().toISOString()
  });

  saveState();
  closeModal();
  render();

  fxCelebrateXp(xp);
  fxPopTask(task.id);
  toast(task.monster ? "👹 MONSTRE VAINCU · +" + xp + " XP · " + task.name : "+" + xp + " XP · " + task.name, task.monster);
  const levelAfter = levelInfo(state.xp).level;
  if (levelAfter > levelBefore) {
    fxCelebrateLevel(levelAfter);
    toast("🎉 NIVEAU " + levelAfter + " ! Nouveau titre : " + titleFor(levelAfter), true);
  }
  checkAchievements();
}

function replayTask(objId, taskId) {
  const obj = state.objectives.find(o => o.id === objId);
  const task = obj ? obj.tasks.find(t => t.id === taskId) : null;
  if (!task || !task.done) return;
  task.done = false;
  saveState();
  render();
  toast("↺ Remise en jeu : " + task.name, false);
}

function toggleTask(objId, taskId, e) {
  fxRememberClick(e);
  const obj = state.objectives.find(o => o.id === objId);
  const task = obj ? obj.tasks.find(t => t.id === taskId) : null;
  if (!task) return;
  if (task.done) {
    state.xp -= task.xp;
    task.done = false;
    task.minutes = 0;
    task.xp = 0;
    const idx = lastLogIndexOf(taskId);
    if (idx !== -1) state.log.splice(idx, 1);
    saveState();
    render();
  } else {
    openTimeModal(objId, taskId);
  }
}

function confirmDeleteObjective(objId) {
  const obj = state.objectives.find(o => o.id === objId);
  if (!obj) return;
  openModal(
    "<h3>Supprimer la quête ?</h3>" +
    "<p class='hint'>« " + esc(obj.name) + " » et toutes ses missions seront supprimées. L'XP déjà gagné est conservé.</p>" +
    "<div class='modal-actions'>" +
    "<button class='btn secondary' onclick='closeModal()'>Annuler</button>" +
    "<button class='btn danger' onclick='deleteObjective(\"" + objId + "\")'>Supprimer</button>" +
    "</div>"
  );
}

function deleteObjective(objId) {
  state.objectives = state.objectives.filter(o => o.id !== objId);
  saveState();
  closeModal();
  goHome();
}

function archiveObjective(objId) {
  const idx = state.objectives.findIndex(o => o.id === objId);
  if (idx === -1) return;
  const obj = state.objectives.splice(idx, 1)[0];
  obj.archivedAt = new Date().toISOString();
  state.archive.push(obj);
  saveState();
  if (currentView === objId) currentView = "home";
  render();
  toast("🗄️ Quête rangée : " + obj.name, true);
}

function openArchiveModal() {
  closeParchMenu();
  window._openArchive = window._openArchive || new Set();
  let html = "<h3>🗄️ Archive</h3>";
  if (state.archive.length === 0) {
    html += "<div class='empty'>L'archive est vide. Ouvre une quête et clique « 🗄️ Archiver » pour la ranger ici : elle sort du jeu mais garde tout son historique.</div>";
  } else {
    html += "<p class='hint'>Clic sur une quête pour voir où tu t'es arrêté. ▶ Reprendre la remet en jeu, rien n'est remis à zéro.</p>";
    html += state.archive.map(o => {
      const st = objectiveStats(o);
      const open = window._openArchive.has(o.id);
      let inner = "<div class='arch-item'>" +
        "<div class='arch-head' onclick=\"toggleArchiveItem('" + o.id + "')\">" +
        "<span class='arch-name'>" + esc(o.name) + (o.cat ? " <span class='obj-type'>" + esc(o.cat) + "</span>" : "") + "</span>" +
        "<span class='arch-meta'>" + st.done + "/" + st.total + " missions · " + st.xp + " XP</span>" +
        "<span class='arch-date'>🗄️ " + (o.archivedAt ? shortDate(o.archivedAt.slice(0, 10)) : "") + "</span>" +
        "</div>";
      if (open) {
        inner += "<div class='arch-detail'>" +
          "<div class='bar' style='height:10px'><div class='" + fillClass(st.pct) + "' style='width:" + st.pct + "%'></div></div>" +
          o.tasks.map(t =>
            "<div class='arch-task" + (t.done ? " ok" : "") + "'>" + (t.done ? "✔" : "◻") + " " + esc(t.name) + (t.monster ? " 👹" : "") + "</div>"
          ).join("") +
          "<div class='arch-actions'>" +
          "<button class='btn small' onclick=\"resumeQuest('" + o.id + "')\">▶ Reprendre</button>" +
          "<button class='btn danger small' onclick=\"confirmDeleteArchived('" + o.id + "')\">🗑️ Supprimer</button>" +
          "</div>" +
          "</div>";
      }
      return inner + "</div>";
    }).join("");
  }
  openModal(html);
}

function toggleArchiveItem(id) {
  window._openArchive = window._openArchive || new Set();
  if (window._openArchive.has(id)) window._openArchive.delete(id);
  else window._openArchive.add(id);
  openArchiveModal();
}

function resumeQuest(id) {
  const idx = state.archive.findIndex(o => o.id === id);
  if (idx === -1) return;
  const obj = state.archive.splice(idx, 1)[0];
  delete obj.archivedAt;
  window._openArchive.delete(id);
  state.objectives.push(obj);
  saveState();
  closeModal();
  currentView = obj.id;
  render();
  toast("▶ " + obj.name + " : retour en jeu", true);
}

function confirmDeleteArchived(id) {
  const obj = state.archive.find(o => o.id === id);
  if (!obj) return;
  openModal(
    "<h3>Supprimer cette quête archivée ?</h3>" +
    "<p class='hint'>« " + esc(obj.name) + " » et toutes ses missions disparaîtront pour de bon. L'XP déjà gagné est conservé.</p>" +
    "<div class='modal-actions'>" +
    "<button class='btn secondary' onclick='openArchiveModal()'>Annuler</button>" +
    "<button class='btn danger' onclick='deleteArchivedQuest(\"" + id + "\")'>Supprimer</button>" +
    "</div>"
  );
}

function deleteArchivedQuest(id) {
  state.archive = state.archive.filter(o => o.id !== id);
  window._openArchive.delete(id);
  saveState();
  openArchiveModal();
}

function duplicateObjective(objId) {
  const obj = state.objectives.find(o => o.id === objId);
  if (!obj) return;
  const copy = {
    id: uid(),
    name: obj.name + " (copie)",
    cat: obj.cat || "",
    tasks: obj.tasks.map(t => ({
      id: uid(),
      name: t.name,
      cat: t.cat || "",
      imp: t.imp,
      done: false,
      minutes: 0,
      xp: 0,
      items: (t.items || []).map(it => ({ id: uid(), name: it.name, done: false }))
    }))
  };
  state.objectives.push(copy);
  saveState();
  render();
  toast("⧉ Quête dupliquée : " + copy.name, false);
}

function toggleParchMenu(e) {
  e.stopPropagation();
  const menu = document.getElementById("parchMenu");
  if (!menu.hidden) { menu.hidden = true; return; }
  renderParchMenu();
  menu.hidden = false;
}

function closeParchMenu() {
  const menu = document.getElementById("parchMenu");
  if (menu) menu.hidden = true;
}

function renderParchMenu() {
  const menu = document.getElementById("parchMenu");
  let body;
  if (state.parchemins.length === 0) {
    body = "<div class='parch-empty'>Aucun parchemin. Ouvre une quête et clique « 📜 Parchemin » pour la mettre de côté, prête à rejouer.</div>";

    "<span class='parch-name'>🗄️ Archive</span>" +
    "<span class='parch-count'>" + state.archive.length + "</span>" +

function createQuestFromParchemin(pid) {
  const p = state.parchemins.find(x => x.id === pid);
  if (!p) return;
  const obj = {
    id: uid(),
    name: p.name,
    cat: p.cat || "",

function createParcheminFromQuest(objId) {

function saveParchemin(objId) {
  const obj = state.objectives.find(o => o.id === objId);
  if (!obj) return;
  const name = document.getElementById("mParchName").value.trim();
  if (!name) return;
  const p = {
    id: uid(),
    name: name,
    cat: obj.cat || "",
    tasks: obj.tasks.map(t => ({
      name: t.name,
      cat: t.cat || "",
      imp: t.imp || 2,
      items: (t.items || []).map(it => ({ name: it.name, done: false }))
    }))
  };
  const idx = state.parchemins.findIndex(x => x.name === p.name);
  if (idx !== -1) {
    p.id = state.parchemins[idx].id;
    state.parchemins[idx] = p;
    toast("📜 Parchemin mis à jour : " + p.name + " (" + p.tasks.length + " missions)", true);
  } else {
    state.parchemins.push(p);
    toast("📜 Parchemin créé : " + p.name + " (" + p.tasks.length + " missions)", true);
  }
  saveState();
  closeModal();
}

window._objDrag = null;

function dragObjective(e, objId) {
  window._objDrag = objId;
  e.dataTransfer.effectAllowed = "move";
  e.dataTransfer.setData("text/plain", objId);
}

function endDragObjective() {
  window._objDrag = null;
  document.querySelectorAll(".obj-card").forEach(el => el.classList.remove("drag-above", "drag-below"));
}

function objDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = "move";
  const card = e.currentTarget;
  const rect = card.getBoundingClientRect();
  const above = e.clientY < rect.top + rect.height / 2;
  document.querySelectorAll(".obj-card").forEach(el => {
    if (el !== card) el.classList.remove("drag-above", "drag-below");
  });
  card.classList.toggle("drag-above", above);
  card.classList.toggle("drag-below", !above);
}

function dropObjective(e, targetId) {
  e.preventDefault();
  e.stopPropagation();
  const srcId = window._objDrag;
  const above = e.currentTarget.classList.contains("drag-above");
  endDragObjective();
  if (!srcId || srcId === targetId) return;
  const srcIdx = state.objectives.findIndex(o => o.id === srcId);
  if (srcIdx === -1) return;
  const moved = state.objectives.splice(srcIdx, 1)[0];
  let tgtIdx = state.objectives.findIndex(o => o.id === targetId);
  if (tgtIdx === -1) {
    state.objectives.splice(srcIdx, 0, moved);
    return;
  }
  if (!above) tgtIdx++;
  state.objectives.splice(tgtIdx, 0, moved);
  saveState();
  render();
}

function saveBgTask(taskId) {
  const name = document.getElementById("mTaskName").value.trim();
  if (!name) return;
  const cat = (document.getElementById("mTaskCat").value || "").trim();
  const due = (document.getElementById("mTaskDue").value || "").trim();
  const imp = window._taskImp;
  const monster = !!window._taskMonster;
  if (taskId) {
    const task = state.background.find(t => t.id === taskId);
    if (!task) return;
    task.name = name;
    task.cat = cat;
    task.due = due;
    task.imp = imp;
    task.monster = monster;
  } else {
    state.background.push({ id: uid(), name, cat, due, imp, done: false, minutes: 0, xp: 0, lastDone: null, monster, items: [] });
  }
  saveState();
  closeModal();
  render();

function toggleBgTask(taskId, e) {
  fxRememberClick(e);
  const task = state.background.find(t => t.id === taskId);
  if (!task) return;
  if (task.done) {
    resetBgTask(taskId);
  } else {
    openBgTimeModal(taskId);
  }
}

function resetBgTask(taskId) {
  const task = state.background.find(t => t.id === taskId);
  if (!task || !task.done) return;
  task.done = false;
  saveState();
  render();
}

function openBgTimeModal(taskId) {
  const task = state.background.find(t => t.id === taskId);
  if (!task) return;
  window._bgTimeCtx = { taskId, rate: xpRate(task) };
  openModal(
    "<h3>Temps de jeu ⏱️</h3>" +
    "<p class='hint'>Combien de temps as-tu passé sur « " + esc(task.name) + " » ?</p>" +
    "<input type='number' id='mMinutes' min='1' step='1' placeholder='Minutes' oninput='updateBgXpPreview()'>" +
    "<div class='xp-preview'>Gain : <span class='val' id='mPreview'>0 XP</span><br>" +
    "<span style='font-size:12px;color:var(--muted)'>" + (task.monster ? "👹 " + xpRate(task) + " XP par minute" : IMPORTANCE[task.imp].icon + " " + task.imp + " XP par minute") + "</span></div>" +
    "<div class='modal-actions'>" +
    "<button class='btn secondary' onclick='closeModal()'>Annuler</button>" +
    "<button class='btn' onclick='completeBgTask()'>✔ Valider</button>" +
    "</div>"
  );
  const input = document.getElementById("mMinutes");
  input.focus();
  input.addEventListener("keydown", e => {
    if (e.key === "Enter") completeBgTask();
  });
}

function updateBgXpPreview() {
  const minutes = parseInt(document.getElementById("mMinutes").value, 10) || 0;
  document.getElementById("mPreview").textContent = (minutes * window._bgTimeCtx.rate) + " XP";
}

function completeBgTask() {
  const ctx = window._bgTimeCtx;
  const task = state.background.find(t => t.id === ctx.taskId);
  if (!task) { closeModal(); return; }
  const minutes = parseInt(document.getElementById("mMinutes").value, 10);
  if (!minutes || minutes < 1) return;
  const xp = minutes * xpRate(task);
  const levelBefore = levelInfo(state.xp).level;

  task.done = true;
  task.minutes = minutes;
  task.xp = xp;
  task.lastDone = new Date().toISOString();
  state.xp += xp;
  state.log.push({
    taskId: task.id,
    objectiveId: "background",
    taskName: task.name,
    cat: task.cat || "",
    minutes,
    mult: xpRate(task),
    xp,
    date: new Date().toISOString()
  });

  saveState();
  closeModal();
  render();

  fxCelebrateXp(xp);
  fxPopTask(task.id);
  toast(task.monster ? "👹 MONSTRE VAINCU · +" + xp + " XP · " + task.name : "+" + xp + " XP · " + task.name, task.monster);
  const levelAfter = levelInfo(state.xp).level;
  if (levelAfter > levelBefore) {
    fxCelebrateLevel(levelAfter);
    toast("🎉 NIVEAU " + levelAfter + " ! Nouveau titre : " + titleFor(levelAfter), true);
  }
  checkAchievements();
}
